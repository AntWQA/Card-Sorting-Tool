  var moveTrail = [];     // [{ at, card, from, to }] -- every placement, in order
  var customGroupSeq = 0;
  var justPlaced = null;  // card label to flash on the next render
  var confirmFinishSort = false; // participant is confirming finishing with cards still in the deck

  // The live study. Defaults to the built-in above, but the moderator can
  // replace it from the Content tab; when db is available the override is
  // shared to every device via config/content.
  var activeStudy = DEFAULT_STUDY;
  var configUnsub = null;

  // Content-editor draft buffers (kept as plain strings so typing never
  // fights a re-render) and confirmation state for destructive actions.
  var sortsDraft = null;
  var strongDraft = null;
  var weakDraft = null;
  var deckWarnDraft = null;
  var shuffleDraft = null;
  var treeImportDraft = "";
  var treeImportResult = null;
  var treeImportError = null;
  var contentUpdatedAt = null;
  var contentError = null;
  var contentWarning = null;
  var confirmClearAll = false;
  var confirmDeleteId = null;
  var confirmRetake = false;     // moderator is confirming a retake of the just-logged sort
  var retakePending = false;     // the upcoming handoff is a retake, not the next sort
  var confirmEndSession = false; // moderator is confirming an early end to the session
  var endedEarly = false;        // the session stopped before every sort ran
  var expandedSessions = {};     // doc._id -> true when its result detail is expanded
  var expandedPairs = false;     // ledger: show every card pair rather than the top slice
  var audienceFilter = "all";    // ledger: "all" | "external" | "internal" -- see audienceDocs()
  var openExportMenu = null;     // "header" | doc._id | null
  var onboardStep = null;        // null | 1..n -- floating tour step
  var onboardPauseStart = 0;     // Date.now() while an onboard step covers a timing screen
  var lastPhaseKey = null;       // "view:phase" from the previous render, gates the entrance animation
  var pendingFocus = null;       // function returning an element to focus right after the next render()
  var shortcutsOpen = false;

  // Content versioning + configurable agreement bands, both moderator-set
  // from the Content tab and shared via config/content alongside the study.
  var activeContentVersion = 1;

  // Incremental session persistence: the in-progress session's own doc id,
  // created as soon as the session starts so a crash mid-session still
  // leaves a resumable record rather than losing everything.
  var sessionDocId = null;
  var sessionStartedAtIso = null;
  var sessionContentVersion = null;
  var confirmDiscardResumeId = null;

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs) {
      if (attrs[k] == null) continue; // skip null/undefined so conditional attrs (e.g. id) can be omitted
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) {
      if (c == null) return;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return e;
  }

  // The small "↵" badge dropped onto each screen's one .cta-primary button
  // (see the global Enter handler below) so the shortcut is visible right
  // on the control instead of hidden in the moderator-only shortcuts panel.
  function ctaKey() {
    return el("kbd", { class: "cta-key", "aria-hidden": "true" }, ["↵"]);
  }

  function fmtTime(ms) {
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60);
    s = s % 60;
    return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
  }

  function plural(n, word, suffix) {
    return n + " " + word + (n === 1 ? "" : (suffix || "s"));
  }

  function median(nums) {
    if (!nums.length) return 0;
    var sorted = nums.slice().sort(function (a, b) { return a - b; });
    return sorted[Math.floor(sorted.length / 2)];
  }

  // Participant-created groups are free text, so "Skin stuff" and
  // "skin  stuff" have to count as the same group when tallying across
  // sessions. Fixed categories go through this too, harmlessly.
  function normaliseName(s) {
    return String(s == null ? "" : s).trim().toLowerCase().replace(/\s+/g, " ");
  }

  function currentSort() {
    return (activeStudy.sorts || DEFAULT_SORTS)[sortIndex] || (activeStudy.sorts || DEFAULT_SORTS)[0];
  }
  function sortCount() {
    return (activeStudy.sorts || DEFAULT_SORTS).length;
  }

  function copyToClipboard(text, btn, textareaEl) {
    var original = btn.textContent;
    function done(ok) {
      btn.textContent = ok ? "Copied" : "Press Ctrl/Cmd+C";
      setTimeout(function () { btn.textContent = original; }, 1500);
    }
    function fallbackCopy() {
      // No visible textarea to select (e.g. a ledger export button) --
      // use a throwaway offscreen one so execCommand still has a selection.
      var target = textareaEl;
      var temp = null;
      if (!target) {
        temp = document.createElement("textarea");
        temp.value = text;
        temp.style.position = "fixed";
        temp.style.top = "-1000px";
        temp.style.left = "-1000px";
        document.body.appendChild(temp);
        target = temp;
      }
      target.focus();
      target.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      if (temp) temp.remove();
      done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, fallbackCopy);
    } else {
      fallbackCopy();
    }
  }

  // Describes the agreement bands in the moderator's own words, reflecting
  // whatever thresholds are set on the Content tab.
  function agreementRuleText() {
    return "A card reads as Strong when at least " + activeStudy.agreementStrong + "% of participants put it in the same group, Contested below " +
      activeStudy.agreementWeak + "%, and Mixed in between.";
  }
  function agreementBand(pct) {
    if (pct == null) return "neutral";
    if (pct >= activeStudy.agreementStrong) return "strong";
    if (pct < activeStudy.agreementWeak) return "contested";
    return "mixed";
  }
  function agreementLabel(pct) {
    if (pct == null) return "No data";
    var band = agreementBand(pct);
    return band === "strong" ? "Strong" : band === "contested" ? "Contested" : "Mixed";
  }

  // ---------- Local storage fallback ----------
  // When the shared db capability isn't available -- the file opened
  // directly, or served from a plain local server, rather than run as the
  // published Artifact -- everything that would otherwise go straight to
  // `db` falls back to this browser's own localStorage instead. Not synced
  // to any other device, but not silently discarded either.
  var LOCAL_LEDGER_KEY = "groupingStudy.ledger.v1";
  var LOCAL_CONTENT_KEY = "groupingStudy.content.v1";
  var localStorageOk = false;
  try {
    var _lsProbe = "__groupingStudy_probe__";
    window.localStorage.setItem(_lsProbe, "1");
    window.localStorage.removeItem(_lsProbe);
    localStorageOk = true;
  } catch (e) { localStorageOk = false; }

  // "shared" -- a live, cross-device ledger (the published Artifact).
  // "local"  -- this browser's own storage only.
  // "none"   -- neither; nothing persists past this page view.
  function storageMode() {
    if (dbReady && db) return "shared";
    if (localStorageOk) return "local";
    return "none";
  }

  function localLedgerRead() {
    try {
      var raw = window.localStorage.getItem(LOCAL_LEDGER_KEY);
      var docs = raw ? JSON.parse(raw) : [];
      return Array.isArray(docs) ? docs : [];
    } catch (e) { return []; }
  }
  function localLedgerWrite(docs) {
    try { window.localStorage.setItem(LOCAL_LEDGER_KEY, JSON.stringify(docs)); } catch (e) {}
  }
  // No live listener needed for a single browser's own storage -- just
  // re-read it into ledgerDocs on demand, sorted the same way the shared
  // ledger's query would be (most recently finished/updated first).
  function refreshLocalLedger() {
    var docs = localLedgerRead();
    docs.sort(function (a, b) {
      var ta = a.finishedAt || a.updatedAt || "";
      var tb = b.finishedAt || b.updatedAt || "";
      if (ta === tb) return 0;
      return ta < tb ? 1 : -1;
    });
    ledgerDocs = docs;
  }

  // ---------- Capability bootstrap ----------
  function initCapabilities() {
    if (window.claude && window.claude.use) {
      window.claude.use("db").then(function (d) {
        db = d; dbReady = !!d; subscribeConfig(); subscribeLedger(); render();
      }).catch(function () { subscribeConfig(); subscribeLedger(); render(); });
      window.claude.use("downloads").then(function (d) { downloads = d; downloadsReady = !!d; render(); }).catch(function () {});
    } else {
      // No Artifact runtime here at all (opened directly, or served from a
      // plain local server) -- go straight to the local-storage fallback
      // rather than leaving everything unsubscribed.
      subscribeConfig();
      subscribeLedger();
    }
  }

  // ---------- Hot state (survive a republish mid-session) ----------
  function snapshotState() {
    return { view: view, phase: phase, participant: participant, practiceRun: practiceRun,
      participantInternal: participantInternal, sortIndex: sortIndex, startedAt: startedAt,
      confidence: confidence, results: results, theme: theme, activeStudy: activeStudy,
      activeContentVersion: activeContentVersion, deckOrder: deckOrder, groups: groups,
      placements: placements, otherReasons: otherReasons, moveTrail: moveTrail,
      customGroupSeq: customGroupSeq, sessionDocId: sessionDocId,
      sessionStartedAtIso: sessionStartedAtIso, sessionContentVersion: sessionContentVersion };
  }
  function restoreState(s) {
    if (!s) return;
    view = s.view || "session"; phase = s.phase || "setup"; participant = s.participant || "";
    practiceRun = !!s.practiceRun; participantInternal = !!s.participantInternal;
    sortIndex = s.sortIndex || 0; startedAt = s.startedAt || 0;
    confidence = s.confidence || null; results = s.results || []; theme = s.theme || "light";
    activeStudy = s.activeStudy || DEFAULT_STUDY;
    activeContentVersion = s.activeContentVersion || 1;
    deckOrder = s.deckOrder || []; groups = s.groups || []; placements = s.placements || {};
    otherReasons = s.otherReasons || {}; moveTrail = s.moveTrail || [];
    customGroupSeq = s.customGroupSeq || 0;
    sessionDocId = s.sessionDocId || null;
    sessionStartedAtIso = s.sessionStartedAtIso || null;
    sessionContentVersion = s.sessionContentVersion || null;
    if (phase === "sorting" && startedAt) startTimerTick();
  }

  // ---------- Study config (moderator-editable, shared via db when
  // available, this browser's own storage otherwise) ----------
  function applyConfigData(data) {
    if (data && Array.isArray(data.sorts) && data.sorts.length) {
      activeStudy = {
        sorts: data.sorts,
        shuffleCards: data.shuffleCards !== false,
        agreementStrong: typeof data.agreementStrong === "number" ? data.agreementStrong : 60,
        agreementWeak: typeof data.agreementWeak === "number" ? data.agreementWeak : 35,
        deckWarnAt: typeof data.deckWarnAt === "number" ? data.deckWarnAt : 30
      };
    }
    activeContentVersion = (data && data.version) || 1;
    contentUpdatedAt = (data && data.updatedAt) || null;
  }

  function subscribeConfig() {
    if (dbReady && db) {
      if (configUnsub) return;
      configUnsub = db.doc("config/content").onSnapshot(function (snap) {
        applyConfigData(snap.exists ? snap.data() : null);
        render();
      }, function () {});
      return;
    }
    if (localStorageOk) {
      try {
        var raw = window.localStorage.getItem(LOCAL_CONTENT_KEY);
        applyConfigData(raw ? JSON.parse(raw) : null);
      } catch (e) {}
    }
  }

  function validateSorts(parsed) {
    if (!Array.isArray(parsed) || !parsed.length) return "Sorts must be a non-empty JSON array.";
    for (var i = 0; i < parsed.length; i++) {
      var s = parsed[i];
      var n = i + 1;
      if (!s || typeof s !== "object") return "Sort " + n + " must be an object.";
      if (typeof s.prompt !== "string" || !s.prompt.trim()) return "Sort " + n + " needs a prompt.";
      if (["open", "closed", "hybrid"].indexOf(s.mode) === -1) return "Sort " + n + " needs a mode of \"open\", \"closed\" or \"hybrid\".";
      if (!Array.isArray(s.cards) || s.cards.length < 2) return "Sort " + n + " needs a cards array with at least 2 cards.";
      for (var c = 0; c < s.cards.length; c++) {
        if (typeof s.cards[c] !== "string" || !s.cards[c].trim()) return "Sort " + n + ", card " + (c + 1) + " must be a non-empty string.";
      }
      var seenCard = {};
      for (var d = 0; d < s.cards.length; d++) {
        var key = normaliseName(s.cards[d]);
        // Cards are identified by their label throughout (placements,
        // agreement, co-occurrence), so a duplicate would silently merge
        // two different things into one row.
        if (seenCard[key]) return "Sort " + n + " has a duplicate card: \"" + s.cards[d] + "\". Card labels must be unique.";
        seenCard[key] = true;
      }
      if (s.mode !== "open") {
        if (!Array.isArray(s.categories) || !s.categories.length) return "Sort " + n + " is " + s.mode + ", so it needs a non-empty categories array.";
        var seenCat = {};
        for (var g = 0; g < s.categories.length; g++) {
          if (typeof s.categories[g] !== "string" || !s.categories[g].trim()) return "Sort " + n + ", category " + (g + 1) + " must be a non-empty string.";
          var ck = normaliseName(s.categories[g]);
          if (seenCat[ck]) return "Sort " + n + " has a duplicate category: \"" + s.categories[g] + "\".";
          seenCat[ck] = true;
        }
      }
    }
    return null;
  }

  function saveContent() {
    contentWarning = null;
    var parsed;
    try {
      parsed = JSON.parse(sortsDraft);
    } catch (e) {
      contentError = "Sorts aren't valid JSON: " + e.message;
      render();
      return;
    }
    var problem = validateSorts(parsed);
    if (problem) { contentError = problem; render(); return; }

    var strong = parseInt(strongDraft, 10);
    var weak = parseInt(weakDraft, 10);
    var warnAt = parseInt(deckWarnDraft, 10);
    if (!(strong >= 0 && strong <= 100)) strong = 60;
    if (!(weak >= 0 && weak <= 100)) weak = 35;
    if (!(warnAt > 0)) warnAt = 30;
    if (weak > strong) { contentError = "The Contested threshold can't be higher than the Strong threshold."; render(); return; }

    // Warnings, not errors -- a long deck or an open sort is a legitimate
    // choice, the moderator just needs to know what it costs.
    var notes = [];
    parsed.forEach(function (s, i) {
      if (s.cards.length > warnAt) {
        notes.push("Sort " + (i + 1) + " has " + s.cards.length + " cards, over the " + warnAt +
          "-card guide. Expect fatigue to distort the back half of a moderated session.");
      }
      if (s.mode === "open") {
        notes.push("Sort " + (i + 1) + " is an open sort. Per-card agreement only counts participants who happened to name a group the same way, so read it as directional at this sample size.");
      }
    });

    contentError = null;
    contentWarning = notes.length ? notes.join(" ") : null;
    activeStudy = {
      sorts: parsed,
      shuffleCards: shuffleDraft !== false,
      agreementStrong: strong,
      agreementWeak: weak,
      deckWarnAt: warnAt
    };
    activeContentVersion = (activeContentVersion || 0) + 1; // every save publishes a new version
    contentUpdatedAt = new Date().toISOString();
    sortsDraft = null; strongDraft = null; weakDraft = null; deckWarnDraft = null; shuffleDraft = null;
    var payload = {
      sorts: activeStudy.sorts, shuffleCards: activeStudy.shuffleCards,
      agreementStrong: strong, agreementWeak: weak, deckWarnAt: warnAt,
      version: activeContentVersion, updatedAt: contentUpdatedAt
    };
    if (dbReady && db) {
      db.doc("config/content").set(payload).catch(function () {});
    } else if (localStorageOk) {
      try { window.localStorage.setItem(LOCAL_CONTENT_KEY, JSON.stringify(payload)); } catch (e) {}
    }
    render();
  }

  function resetContent() {
    activeStudy = DEFAULT_STUDY;
    activeContentVersion = (activeContentVersion || 0) + 1;
    contentUpdatedAt = new Date().toISOString();
    sortsDraft = null; strongDraft = null; weakDraft = null; deckWarnDraft = null; shuffleDraft = null;
    contentError = null; contentWarning = null;
    var payload = {
      sorts: DEFAULT_STUDY.sorts, shuffleCards: DEFAULT_STUDY.shuffleCards,
      agreementStrong: DEFAULT_STUDY.agreementStrong, agreementWeak: DEFAULT_STUDY.agreementWeak,
      deckWarnAt: DEFAULT_STUDY.deckWarnAt,
      version: activeContentVersion, updatedAt: contentUpdatedAt
    };
    if (dbReady && db) {
      db.doc("config/content").set(payload).catch(function () {});
    } else if (localStorageOk) {
      try { window.localStorage.setItem(LOCAL_CONTENT_KEY, JSON.stringify(payload)); } catch (e) {}
    }
    render();
  }

  // Turns a Wayfinding Trial navigation structure into a category list for
  // a closed or hybrid sort, so the card sort measures agreement against
  // the exact structure the tree test is validating rather than a
  // hand-retyped approximation that quietly drifts from it.
  //
  // It takes the tree's filing level: the branches its destination pages
  // actually sit under. A top-level branch whose children are already
  // leaves (an array) becomes a category in its own right; otherwise each
  // of its sub-branches does, prefixed with the parent where the bare name
  // would be ambiguous out of context.
  function deriveCategoriesFromTree(tree) {
    var out = [];
    var seen = {};
    function push(name) {
      var key = normaliseName(name);
      if (!key || seen[key]) return;
      seen[key] = true;
      out.push(name);
    }
    Object.keys(tree).forEach(function (topKey) {
      // "Footer: Our Story" and friends carry a placement prefix that means
      // nothing to a participant sorting cards.
      var top = topKey.replace(/^[A-Za-z]+:\s*/, "");
      var node = tree[topKey];
      if (Array.isArray(node) || node == null || typeof node !== "object") {
        push(top);
        return;
      }
      var subKeys = Object.keys(node);
      if (!subKeys.length) { push(top); return; }
      subKeys.forEach(function (sub) {
        // A sub-branch is qualified with its parent unless it already
        // carries the parent's name ("Shop by Category" needs no "Shop:").
        // Applying one rule per parent rather than judging each name keeps
        // a branch's children consistent with each other, which is what a
        // participant reads them against. It also resolves the names that
        // are genuinely ambiguous out of the nav: "Essential Oils" is both
        // a Learn branch and a Shop destination, and "Resources" means
        // nothing on a card-sort column header.
        var carriesParent = normaliseName(sub).indexOf(normaliseName(top)) !== -1;
        push(carriesParent ? sub : top + ": " + sub);
      });
    });
    return out;
  }

  function runTreeImport() {
    treeImportResult = null;
    treeImportError = null;
    var parsed;
    try {
      parsed = JSON.parse(treeImportDraft);
    } catch (e) {
      treeImportError = "That isn't valid JSON: " + e.message;
      render();
      return;
    }
    if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
      treeImportError = "A navigation structure should be a JSON object of branches.";
      render();
      return;
    }
    var derived = deriveCategoriesFromTree(parsed);
    if (!derived.length) {
      treeImportError = "No branches found in that structure.";
      render();
      return;
    }
    treeImportResult = derived;
    render();
  }

  function toggleTheme() { theme = theme === "dark" ? "light" : "dark"; render(); }

  // ---------- Timer ----------
  function startTimerTick() {
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = setInterval(function () {
      var t = document.getElementById("timer-readout");
      if (t) t.textContent = fmtTime(Date.now() - startedAt);
    }, 250);
  }
  function stopTimerTick() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }

  // The onboarding tour's board step appears on top of a sort that's
  // already timing -- freeze the clock while it's up so reading the tour
  // doesn't inflate the recorded time, then shift startedAt forward by
  // however long it was up so both the live readout and the elapsed time
  // saved in finishSort() pick up exactly where they left off.
  function pauseTimerForOnboard() {
    if (phase === "sorting" && startedAt && !onboardPauseStart) {
      onboardPauseStart = Date.now();
      stopTimerTick();
    }
  }
  function resumeTimerFromOnboard() {
    if (onboardPauseStart) {
      startedAt += (Date.now() - onboardPauseStart);
      onboardPauseStart = 0;
      if (phase === "sorting") startTimerTick();
    }
  }

  // ---------- Board setup and placement ----------
  function shuffled(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // Builds the board for the sort about to run. The deck order is shuffled
  // per participant by default: cards shown first get placed while people
  // are still fresh and still forming their mental model, so a fixed order
  // would bake the same bias into every session.
  function buildBoard() {
    var s = currentSort();
    deckOrder = activeStudy.shuffleCards === false ? s.cards.slice() : shuffled(s.cards);
    groups = [];
    customGroupSeq = 0;
    if (s.mode !== "open") {
      (s.categories || []).forEach(function (name, i) {
        groups.push({ id: "c" + i, name: name, fixed: true });
      });
    }
    placements = {};
    otherReasons = {};
    moveTrail = [];
    selectedCard = null;
    justPlaced = null;
    confirmFinishSort = false;
  }

  function otherEnabled() {
    return currentSort().allowOther !== false;
  }
  function canAddGroups() {
    return currentSort().mode !== "closed";
  }
  function groupById(id) {
    for (var i = 0; i < groups.length; i++) if (groups[i].id === id) return groups[i];
    return null;
  }
  function groupLabel(id) {
    if (id === OTHER_ID) return OTHER_LABEL;
    var g = groupById(id);
    if (!g) return "the deck";
    return g.name || "an unnamed group";
  }
  // Cards keep the order they were placed in, which is the order a
  // participant would expect to read them back in.
  function cardsIn(groupId) {
    var out = [];
    deckOrder.forEach(function (c) { if (placements[c] === groupId) out.push(c); });
    return out;
  }
  function deckCards() {
    return deckOrder.filter(function (c) { return !placements[c]; });
  }
  function placedCount() {
    return deckOrder.length - deckCards().length;
  }

  function placeCard(card, targetId) {
    if (!card) return;
    var from = placements[card] || "deck";
    if (from === targetId || (targetId === "deck" && !placements[card])) {
      // Dropped back where it came from -- not a move, and not worth a
      // trail entry that would inflate the recorded hesitation.
      selectedCard = null;
      render();
      return;
    }
    if (targetId === "deck") {
      delete placements[card];
      delete otherReasons[card];
    } else {
      placements[card] = targetId;
      if (targetId !== OTHER_ID) delete otherReasons[card];
    }
    moveTrail.push({ at: startedAt ? Date.now() - startedAt : 0, card: card, from: from, to: targetId });
    selectedCard = null;
    justPlaced = card;
    confirmFinishSort = false;
    render();
    // The flash is a one-shot confirmation, not a persistent state -- clear
    // it so the next unrelated render doesn't replay it.
    setTimeout(function () { justPlaced = null; }, 400);
  }

  function toggleSelect(card) {
    selectedCard = selectedCard === card ? null : card;
    render();
  }
  function clearSelection() {
    if (selectedCard == null) return;
    selectedCard = null;
    render();
  }

  function addCustomGroup() {
    customGroupSeq++;
    var id = "u" + customGroupSeq;
    groups.push({ id: id, name: "", fixed: false });
    render();
    // Drop straight into the new group's name field: naming it is the only
    // thing that can usefully happen next.
    requestAnimationFrame(function () {
      var input = document.querySelector('.group-name-input[data-group-id="' + id + '"]');
      if (input) { input.focus(); input.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
    });
  }
  function renameGroup(id, name) {
    var g = groupById(id);
    if (g && !g.fixed) g.name = name;
  }
  function deleteGroup(id) {
    var g = groupById(id);
    if (!g || g.fixed) return;
    // Its cards go back to the deck rather than vanishing with it.
    cardsIn(id).forEach(function (c) {
      delete placements[c];
      moveTrail.push({ at: startedAt ? Date.now() - startedAt : 0, card: c, from: id, to: "deck" });
    });
    groups = groups.filter(function (x) { return x.id !== id; });
    render();
  }
  function setOtherReason(card, text) {
    if (text && text.trim()) otherReasons[card] = text;
    else delete otherReasons[card];
  }

  // ---------- Pointer dragging ----------
  // One pointer-based implementation rather than HTML5 drag-and-drop,
  // which doesn't fire on touch at all -- these sessions run on a shared
  // tablet or laptop, so the same code has to serve both. A press that
  // never travels past the threshold falls through to the tap-to-place
  // path instead, which is also the keyboard path.
  var DRAG_THRESHOLD = 6;
  var dragState = null;
  var suppressNextClick = false;

  function onCardPointerDown(e, card, fromId, chipEl) {
    if (e.button != null && e.button !== 0) return;
    dragState = {
      card: card, fromId: fromId, chip: chipEl,
      startX: e.clientX, startY: e.clientY,
      started: false, ghost: null, overEl: null
    };
    window.addEventListener("pointermove", onCardPointerMove);
    window.addEventListener("pointerup", onCardPointerUp);
    window.addEventListener("pointercancel", onCardPointerCancel);
  }

  function beginDrag(e) {
    var d = dragState;
    var rect = d.chip.getBoundingClientRect();
    var ghost = d.chip.cloneNode(true);
    ghost.classList.add("card-chip", "drag-ghost");
    ghost.classList.remove("selected", "just-placed");
    ghost.style.width = rect.width + "px";
    ghost.style.left = rect.left + "px";
    ghost.style.top = rect.top + "px";
    document.body.appendChild(ghost);
    d.ghost = ghost;
    d.grabX = d.startX - rect.left;
    d.grabY = d.startY - rect.top;
    d.started = true;
    d.chip.classList.add("dragging");
    document.body.style.cursor = "grabbing";
  }

  function dropTargetAt(x, y) {
    var node = document.elementFromPoint(x, y);
    return node ? node.closest("[data-drop-id]") : null;
  }

  function onCardPointerMove(e) {
    var d = dragState;
    if (!d) return;
    if (!d.started) {
      if (Math.abs(e.clientX - d.startX) < DRAG_THRESHOLD && Math.abs(e.clientY - d.startY) < DRAG_THRESHOLD) return;
      beginDrag(e);
    }
    e.preventDefault();
    d.ghost.style.left = (e.clientX - d.grabX) + "px";
    d.ghost.style.top = (e.clientY - d.grabY) + "px";

    var target = dropTargetAt(e.clientX, e.clientY);
    if (target !== d.overEl) {
      if (d.overEl) d.overEl.classList.remove("drop-target");
      if (target) target.classList.add("drop-target");
      d.overEl = target;
    }

    // A tall board scrolls well past the viewport, so a drag that reaches
    // the edge has to bring the rest of it into reach.
    var EDGE = 90;
    if (e.clientY < EDGE) window.scrollBy(0, -14);
    else if (e.clientY > window.innerHeight - EDGE) window.scrollBy(0, 14);
  }

  function endDragCleanup() {
    var d = dragState;
    if (!d) return;
    if (d.ghost) d.ghost.remove();
    if (d.chip) d.chip.classList.remove("dragging");
    if (d.overEl) d.overEl.classList.remove("drop-target");
    document.body.style.cursor = "";
    window.removeEventListener("pointermove", onCardPointerMove);
    window.removeEventListener("pointerup", onCardPointerUp);
    window.removeEventListener("pointercancel", onCardPointerCancel);
    dragState = null;
  }

  function onCardPointerUp(e) {
    var d = dragState;
    if (!d) return;
    var wasDrag = d.started;
    var card = d.card;
    var target = wasDrag ? dropTargetAt(e.clientX, e.clientY) : null;
    endDragCleanup();
    if (!wasDrag) return; // a press that never travelled: let the click handler select it
    // The click event that follows this pointerup would otherwise re-open
    // the selection the drag has just resolved.
    suppressNextClick = true;
    setTimeout(function () { suppressNextClick = false; }, 0);
    if (target) placeCard(card, target.dataset.dropId);
  }

  function onCardPointerCancel() {
    var wasDrag = dragState && dragState.started;
    endDragCleanup();
    if (wasDrag) { suppressNextClick = true; setTimeout(function () { suppressNextClick = false; }, 0); }
  }

  // ---------- Sort lifecycle ----------
  function unnamedCustomGroups() {
    return groups.filter(function (g) { return !g.fixed && cardsIn(g.id).length && !String(g.name || "").trim(); });
  }
  function customGroups() {
    return groups.filter(function (g) { return !g.fixed; });
  }

  function requestFinishSort() {
    if (deckCards().length && !confirmFinishSort) {
      confirmFinishSort = true;
      render();
      return;
    }
    finishSortToNaming();
  }

  function finishSortToNaming() {
    confirmFinishSort = false;
    selectedCard = null;
    // Empty groups a participant made and then emptied again carry no
    // signal, and asking them to name one is a pointless question.
    groups = groups.filter(function (g) { return g.fixed || cardsIn(g.id).length; });
    if (customGroups().length) {
      phase = "naming";
      stopTimerTick();
      render();
      return;
    }
    finishSort();
  }

  function finishSort() {
    stopTimerTick();
    var elapsed = startedAt ? Date.now() - startedAt : 0;
    var s = currentSort();
    var groupPayload = groups
      .filter(function (g) { return cardsIn(g.id).length; })
      .map(function (g) {
        return { id: g.id, name: g.fixed ? g.name : String(g.name || "").trim(), fixed: !!g.fixed, cards: cardsIn(g.id) };
      });
    var otherPayload = cardsIn(OTHER_ID).map(function (c) {
      return { card: c, reason: otherReasons[c] || "" };
    });
    results.push({
      sortIndex: sortIndex,
      prompt: s.prompt,
      tests: s.tests || "",
      mode: s.mode,
      deckOrder: deckOrder.slice(),
      groups: groupPayload,
      other: otherPayload,
      unsorted: deckCards(),
      timeMs: elapsed,
      moves: moveTrail.length,
      trail: moveTrail.slice(),
      confidence: null,
      notes: ""
    });
    phase = "return";
    render();
  }

  function setConfidence(v) { confidence = v; results[results.length - 1].confidence = v; render(); }
  function setNotes(v) { results[results.length - 1].notes = v; }

  function resultsForDoc() {
    return results.map(function (r) {
      return {
        sortIndex: r.sortIndex, prompt: r.prompt, tests: r.tests, mode: r.mode,
        deckOrder: r.deckOrder || [], groups: r.groups || [], other: r.other || [],
        unsorted: r.unsorted || [], timeMs: r.timeMs, moves: r.moves,
        trail: r.trail || [], confidence: r.confidence, notes: r.notes
      };
    });
  }

  // Writes the session's progress to its own ledger doc as each sort is
  // logged, rather than only once at the very end -- a crash, closed tab
  // or moderator slip mid-session leaves a resumable "in-progress" record
  // instead of losing the run. Practice runs are never written.
  function persistSession(isFinal) {
    if (practiceRun) return;
    var payload = {
      participant: participant,
      participantInternal: participantInternal,
      status: isFinal ? "completed" : "in-progress",
      startedAt: sessionStartedAtIso,
      contentVersion: sessionContentVersion,
      results: resultsForDoc(),
      updatedAt: new Date().toISOString(),
      finishedAt: isFinal ? new Date().toISOString() : null
    };
    if (dbReady && db) {
      if (sessionDocId) {
        db.collection("sessions").doc(sessionDocId).set(payload).catch(function () {});
      } else {
        db.collection("sessions").add(payload).then(function (ref) {
          sessionDocId = (ref && ref.id) ? ref.id : sessionDocId;
        }).catch(function () {});
      }
      return;
    }
    if (localStorageOk) {
      if (!sessionDocId) sessionDocId = "local-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
      var docs = localLedgerRead();
      var found = false;
      for (var i = 0; i < docs.length; i++) {
        if (docs[i]._id === sessionDocId) { docs[i] = Object.assign({ _id: sessionDocId }, payload); found = true; break; }
      }
      if (!found) docs.push(Object.assign({ _id: sessionDocId }, payload));
      localLedgerWrite(docs);
      refreshLocalLedger();
    }
  }

  function nextSort() {
    sortIndex++;
    confidence = null;
    if (sortIndex >= sortCount()) {
      phase = "done";
      endedEarly = false;
      persistSession(true);
    } else {
      buildBoard();
      phase = "preview";
      persistSession(false);
    }
    render();
  }

  function endSessionEarly() {
    confirmEndSession = false;
    endedEarly = true;
    phase = "done";
    persistSession(true);
    render();
  }

  // Discards the just-logged sort (nothing has hit the shared ledger yet --
  // that only happens via nextSort() -- so this is a plain in-memory undo)
  // and hands the device back for another go at the same deck.
  function retakeSort() {
    results.pop();
    confidence = null;
    buildBoard();
    confirmRetake = false;
    retakePending = true;
    phase = "preview";
    render();
  }

  function goBrief() {
    phase = "brief";
    onboardStep = null;
    retakePending = false;
    render();
    if (sortIndex === 0) {
      // Let the participant see the plain screen for a beat before the
      // onboarding tour fades in over it.
      setTimeout(function () {
        if (phase === "brief" && sortIndex === 0) {
          onboardStep = 1;
          renderOnboardTour();
        }
      }, 900);
    }
  }

  function goSorting() {
    startedAt = Date.now();
    phase = "sorting";
    onboardStep = null;
    render();
    startTimerTick();
    if (sortIndex === 0) {
      // Two more tour steps covering the board itself, shown once the
      // participant has had a moment to look at it. Their visible time is
      // excluded from the recorded duration (see pauseTimerForOnboard()).
      setTimeout(function () {
        if (phase === "sorting" && sortIndex === 0) {
          onboardStep = 3;
          pauseTimerForOnboard();
          renderOnboardTour();
        }
      }, 900);
    }
  }

  function goCapture() { phase = "capture"; render(); }

  function startSetup() {
    view = "session"; phase = "setup"; participant = ""; practiceRun = false; participantInternal = false;
    sortIndex = 0; confidence = null; results = []; startedAt = 0;
    deckOrder = []; groups = []; placements = {}; otherReasons = {}; moveTrail = []; selectedCard = null;
    endedEarly = false; confirmEndSession = false; confirmRetake = false; retakePending = false;
    confirmFinishSort = false;
    sessionDocId = null; sessionStartedAtIso = null; sessionContentVersion = null; confirmDiscardResumeId = null;
    render();
  }

  // Participant names must be unique. The ledger is the only source of
  // truth for "already used" -- practice runs are never saved there, so
  // they never make a name unavailable, but a new session (practice or
  // not) still can't reuse a name that's already in the ledger.
  function isDuplicateParticipant(name) {
    var n = name.trim().toLowerCase();
    if (!n) return false;
    return ledgerDocs.some(function (d) { return (d.participant || "").trim().toLowerCase() === n; });
  }

  function beginSession(name, isPractice, isInternal) {
    if (isDuplicateParticipant(name)) return; // defensive: guards a race with another device saving that name
    participant = name; practiceRun = isPractice; participantInternal = !!isInternal;
    sortIndex = 0; results = []; confidence = null;
    buildBoard();
    phase = "preview";
    endedEarly = false; confirmEndSession = false; confirmRetake = false; retakePending = false;
    sessionDocId = null; sessionStartedAtIso = new Date().toISOString(); sessionContentVersion = activeContentVersion;
    render();
    // Create the in-progress doc right away (rather than waiting for the
    // first sort to finish) so even a crash before anything completes
    // still leaves a resumable record instead of nothing at all.
    if (!isPractice) persistSession(false);
  }

  function resumeSession(doc) {
    sessionDocId = doc._id;
    participant = doc.participant || "";
    practiceRun = false;
    participantInternal = !!doc.participantInternal;
    results = (doc.results || []).slice();
    sortIndex = results.length;
    confidence = null;
    sessionContentVersion = doc.contentVersion || activeContentVersion;
    sessionStartedAtIso = doc.startedAt || new Date().toISOString();
    endedEarly = false; confirmEndSession = false; confirmRetake = false; retakePending = false;
    confirmDiscardResumeId = null;
    if (sortIndex >= sortCount()) {
      // Edge case: every sort was already logged but the doc never got
      // marked completed (the final save was interrupted too) -- finish
      // that bookkeeping now rather than leaving it in-progress forever.
      phase = "done";
      endedEarly = false;
      persistSession(true);
    } else {
      buildBoard();
      phase = "preview";
    }
    render();
  }

  function discardInProgress(id) {
    if (dbReady && db) {
      db.collection("sessions").doc(id).delete().catch(function () {});
    } else if (localStorageOk) {
      localLedgerWrite(localLedgerRead().filter(function (d) { return d._id !== id; }));
      refreshLocalLedger();
    }
    confirmDiscardResumeId = null;
    render();
  }

  // ---------- Ledger ----------
  function subscribeLedger() {
    if (dbReady && db) {
      if (ledgerUnsub) return;
      ledgerUnsub = db.collection("sessions").orderBy("finishedAt", "desc").limit(200).onSnapshot(function (snap) {
        ledgerDocs = snap.docs.map(function (d) {
          var data = d.data();
          return data ? Object.assign({ _id: d.id }, data) : null;
        }).filter(Boolean);
        if (view === "ledger") render();
      }, function () {});
      return;
    }
    if (localStorageOk) refreshLocalLedger();
  }

  function findSessionToggle(docId) {
    var btns = document.querySelectorAll(".session-row-toggle");
    for (var i = 0; i < btns.length; i++) if (btns[i].dataset.docId === docId) return btns[i];
    return null;
  }
  function findDeleteBtn(docId) {
    var btns = document.querySelectorAll(".ledger-delete-btn");
    for (var i = 0; i < btns.length; i++) if (btns[i].dataset.docId === docId) return btns[i];
    return null;
  }
  function focusMainHeading() { return document.querySelector("main h2, main h1"); }

  function deleteSession(id) {
    if (dbReady && db) {
      db.collection("sessions").doc(id).delete().catch(function () {});
    } else if (localStorageOk) {
      localLedgerWrite(localLedgerRead().filter(function (d) { return d._id !== id; }));
      refreshLocalLedger();
    } else { return; }
    confirmDeleteId = null;
    scheduleFocus(focusMainHeading);
    render();
  }

  function clearAllSessions() {
    if (dbReady && db) {
      ledgerDocs.forEach(function (doc) { db.collection("sessions").doc(doc._id).delete().catch(function () {}); });
    } else if (localStorageOk) {
      localLedgerWrite([]);
      refreshLocalLedger();
    } else { return; }
    confirmClearAll = false;
    scheduleFocus(focusMainHeading);
    render();
  }

  // Lets the moderator revisit a saved session later and amend a sort's
  // notes. The `results` array is replaced wholesale (db update() merges
  // top-level fields but not array contents), so it's cloned with just
  // that one entry's notes changed.
  function updateSessionNotes(docId, resultIndex, notesText, btn) {
    var doc = ledgerDocs.filter(function (d) { return d._id === docId; })[0];
    if (!doc) return;
    var newResults = (doc.results || []).map(function (r, i) {
      if (i !== resultIndex) return r;
      return Object.assign({}, r, { notes: notesText });
    });
    function ok() { if (btn) { btn.textContent = "Saved"; setTimeout(function () { btn.textContent = "Save"; }, 1200); } }
    function fail() { if (btn) { btn.textContent = "Couldn't save"; setTimeout(function () { btn.textContent = "Save"; }, 1500); } }
    if (dbReady && db) {
      db.collection("sessions").doc(docId).update({ results: newResults }).then(ok).catch(fail);
    } else if (localStorageOk) {
      var docs = localLedgerRead();
      for (var i = 0; i < docs.length; i++) {
        if (docs[i]._id === docId) { docs[i] = Object.assign({}, docs[i], { results: newResults }); break; }
      }
      localLedgerWrite(docs);
      refreshLocalLedger();
      ok();
    } else { fail(); }
  }

  // ---------- Audience ----------
  // doTERRA staff already know the proposed structure, so their sorts are
  // not comparable to a customer's and blending the two lifts every
  // agreement figure. Everything on the Ledger reads through this filter:
  // the aggregates, the session log, and the export, so the numbers on
  // screen are always the numbers in the file.
  //
  // Deliberately NOT applied to the duplicate-name check, the resume
  // banner or the in-progress count: those must always see every session
  // regardless of what the Ledger is currently showing.
  function audienceDocs() {
    if (audienceFilter === "external") return ledgerDocs.filter(function (d) { return !d.participantInternal; });
    if (audienceFilter === "internal") return ledgerDocs.filter(function (d) { return !!d.participantInternal; });
    return ledgerDocs;
  }
  function audienceCounts(docs) {
    var list = docs || ledgerDocs;
    var internal = list.filter(function (d) { return !!d.participantInternal; }).length;
    return { all: list.length, internal: internal, external: list.length - internal };
  }
  function audienceName(which) {
    return which === "external" ? "Customers" : which === "internal" ? "doTERRA staff" : "Everyone";
  }
  // Describes a set of sessions by its actual make-up rather than by the
  // filter, so an export says what is in it however it was produced.
  function audienceSummary(docs) {
    var c = audienceCounts(docs);
    if (!c.all) return "no participants";
    if (!c.internal) return plural(c.external, "customer");
    if (!c.external) return plural(c.internal, "doTERRA staff member") ;
    return plural(c.all, "participant") + " (" + c.external + " customer" + (c.external === 1 ? "" : "s") +
      ", " + c.internal + " doTERRA staff)";
  }

  // ---------- Analysis ----------
  // Every result for one sort index, across the sessions passed in.
  // Takes the docs explicitly rather than reading ledgerDocs, so an export
  // of one session is never silently narrowed by the Ledger's own filter.
  function resultsForSort(sortIdx, docs) {
    var out = [];
    (docs || []).forEach(function (doc) {
      (doc.results || []).forEach(function (r) {
        if (r.sortIndex === sortIdx) out.push({ doc: doc, r: r });
      });
    });
    return out;
  }

  // card -> { group: normalised name | null, display, parked, unsorted }
  // for one result. "parked" means the Other bay; "unsorted" means it was
  // never taken out of the deck. Both are tracked separately from grouping
  // because they mean different things: one is a judgement, one isn't.
  function placementMap(r) {
    var map = {};
    (r.groups || []).forEach(function (g) {
      var display = g.name || "(unnamed group)";
      (g.cards || []).forEach(function (c) {
        map[c] = { group: normaliseName(display), display: display, parked: false, unsorted: false };
      });
    });
    (r.other || []).forEach(function (o) {
      map[o.card] = { group: null, display: OTHER_LABEL, parked: true, unsorted: false, reason: o.reason || "" };
    });
    (r.unsorted || []).forEach(function (c) {
      map[c] = { group: null, display: "(left in the deck)", parked: false, unsorted: true };
    });
    return map;
  }

  function analysisForSort(sortIdx, docs) {
    var rows = resultsForSort(sortIdx, docs);
    var n = rows.length;
    var cardStats = {};   // card -> { n, byGroup: {norm: {display, count}}, parked, unsorted, reasons: [] }
    var pairTogether = {};// "a||b" -> count grouped together
    var pairBoth = {};    // "a||b" -> count where both were in a real group
    var addedGroups = {}; // norm -> { display, uses, sizes: [] }
    var times = [], customCounts = [], unsortedCounts = [], moveCounts = [];

    rows.forEach(function (row) {
      var r = row.r;
      var map = placementMap(r);
      var deck = (r.deckOrder && r.deckOrder.length) ? r.deckOrder : Object.keys(map);
      times.push(r.timeMs || 0);
      moveCounts.push(r.moves || 0);
      unsortedCounts.push((r.unsorted || []).length);
      customCounts.push((r.groups || []).filter(function (g) { return !g.fixed; }).length);

      (r.groups || []).forEach(function (g) {
        if (g.fixed) return;
        var key = normaliseName(g.name || "(unnamed group)");
        if (!addedGroups[key]) addedGroups[key] = { display: g.name || "(unnamed group)", uses: 0, sizes: [] };
        addedGroups[key].uses++;
        addedGroups[key].sizes.push((g.cards || []).length);
      });

      deck.forEach(function (card) {
        if (!cardStats[card]) cardStats[card] = { n: 0, byGroup: {}, parked: 0, unsorted: 0, reasons: [] };
        var st = cardStats[card];
        st.n++;
        var p = map[card];
        if (!p) { st.unsorted++; return; }
        if (p.unsorted) { st.unsorted++; return; }
        if (p.parked) {
          st.parked++;
          if (p.reason) st.reasons.push({ participant: row.doc.participant || "(unnamed)", reason: p.reason });
          return;
        }
        if (!st.byGroup[p.group]) st.byGroup[p.group] = { display: p.display, count: 0 };
        st.byGroup[p.group].count++;
      });

      // Co-occurrence over real groups only. Two cards both parked in the
      // Other bay is a shared judgement about the categories, not evidence
      // that they belong together, so it must not read as agreement.
      var grouped = deck.filter(function (c) { return map[c] && map[c].group; });
      for (var i = 0; i < grouped.length; i++) {
        for (var j = i + 1; j < grouped.length; j++) {
          var a = grouped[i], b = grouped[j];
          var key = a < b ? a + "||" + b : b + "||" + a;
          pairBoth[key] = (pairBoth[key] || 0) + 1;
          if (map[a].group === map[b].group) pairTogether[key] = (pairTogether[key] || 0) + 1;
        }
      }
    });

    var cards = Object.keys(cardStats).map(function (card) {
      var st = cardStats[card];
      var top = null;
      Object.keys(st.byGroup).forEach(function (k) {
        if (!top || st.byGroup[k].count > top.count) top = st.byGroup[k];
      });
      return {
        card: card, n: st.n,
        top: top ? top.display : null,
        topCount: top ? top.count : 0,
        // Denominator is every participant who saw the card, not just
        // those who filed it, so a card half of them refused to place
        // can't report near-total agreement.
        topPct: st.n ? Math.round((top ? top.count : 0) / st.n * 100) : null,
        parked: st.parked,
        parkedPct: st.n ? Math.round(st.parked / st.n * 100) : 0,
        unsorted: st.unsorted,
        unsortedPct: st.n ? Math.round(st.unsorted / st.n * 100) : 0,
        distinctGroups: Object.keys(st.byGroup).length,
        reasons: st.reasons
      };
    }).sort(function (a, b) {
      if (a.topPct === b.topPct) return a.card < b.card ? -1 : 1;
      return (a.topPct == null ? -1 : a.topPct) - (b.topPct == null ? -1 : b.topPct);
    });

    var pairs = Object.keys(pairBoth).map(function (key) {
      var parts = key.split("||");
      var together = pairTogether[key] || 0;
      return { a: parts[0], b: parts[1], together: together, both: pairBoth[key],
        pct: Math.round(together / pairBoth[key] * 100) };
    }).filter(function (p) { return p.together > 0; })
      .sort(function (x, y) { return y.pct - x.pct || y.both - x.both; });

    var added = Object.keys(addedGroups).map(function (k) {
      return { name: addedGroups[k].display, uses: addedGroups[k].uses, medianSize: median(addedGroups[k].sizes) };
    }).sort(function (x, y) { return y.uses - x.uses; });

    var parked = cards.filter(function (c) { return c.parked > 0; })
      .sort(function (x, y) { return y.parked - x.parked; });

    return {
      n: n, cards: cards, pairs: pairs, addedGroups: added, parked: parked,
      medianTime: median(times), medianCustom: median(customCounts),
      medianUnsorted: median(unsortedCounts), medianMoves: median(moveCounts)
    };
  }

  function participantTypeLabel(doc) {
    return doc.participantInternal ? "Internal (doTERRA staff)" : "External (customer)";
  }

  // ---------- Exports ----------
  function csvCell(v) {
    var s = String(v == null ? "" : v).replace(/"/g, '""');
    return /[",\n]/.test(s) ? '"' + s + '"' : s;
  }
  function csvJoin(rows) {
    return rows.map(function (row) { return row.map(csvCell).join(","); }).join("\n");
  }

  // One row per card per sort: the shape that joins cleanly against the
  // Wayfinding Trial export on participant name in a spreadsheet.
  function csvForDocs(docs) {
    var rows = [["Participant", "Participant type", "Sort #", "Prompt", "Mode", "Card", "Placed in",
      "Placement type", "Why it didn't fit", "Sort time (s)", "Moves", "Confidence", "Notes", "Content v", "Finished at"]];
    docs.forEach(function (doc) {
      (doc.results || []).forEach(function (r) {
        var map = placementMap(r);
        var deck = (r.deckOrder && r.deckOrder.length) ? r.deckOrder : Object.keys(map);
        var fixedNames = {};
        (r.groups || []).forEach(function (g) { if (g.fixed) fixedNames[normaliseName(g.name)] = true; });
        deck.forEach(function (card) {
          var p = map[card];
          var placedIn = "", type = "unsorted", reason = "";
          if (p && p.parked) { placedIn = OTHER_LABEL; type = "other"; reason = p.reason || ""; }
          else if (p && p.group) { placedIn = p.display; type = fixedNames[p.group] ? "category" : "participant group"; }
          rows.push([doc.participant, participantTypeLabel(doc), r.sortIndex + 1, r.prompt, r.mode, card,
            placedIn, type, reason, Math.round((r.timeMs || 0) / 1000), r.moves == null ? "" : r.moves,
            r.confidence == null ? "" : r.confidence, r.notes || "", doc.contentVersion || "", doc.finishedAt || ""]);
        });
      });
    });
    return csvJoin(rows);
  }

  // A square card-by-card matrix of "what % of participants who placed
  // both of these put them in the same group". This is the file to open in
  // a stats package if the sample ever gets big enough for clustering.
  function coOccurrenceCsv(docs) {
    var sections = [];
    (activeStudy.sorts || DEFAULT_SORTS).forEach(function (s, idx) {
      var a = analysisForSort(idx, docs);
      if (!a.n) return;
      var cards = a.cards.map(function (c) { return c.card; }).sort();
      var lookup = {};
      a.pairs.forEach(function (p) { lookup[p.a + "||" + p.b] = p.pct; });
      var rows = [["Sort " + (idx + 1) + " - % of participants grouping the pair together (n=" + a.n + ")"]];
      rows.push([""].concat(cards));
      cards.forEach(function (rowCard) {
        var line = [rowCard];
        cards.forEach(function (colCard) {
          if (rowCard === colCard) { line.push("100"); return; }
          var key = rowCard < colCard ? rowCard + "||" + colCard : colCard + "||" + rowCard;
          line.push(lookup[key] == null ? "0" : String(lookup[key]));
        });
        rows.push(line);
      });
      sections.push(csvJoin(rows));
    });
    return sections.join("\n\n");
  }

  function jsonForDocs(docs) {
    return JSON.stringify(docs.map(function (doc) {
      return {
        participant: doc.participant,
        participantType: doc.participantInternal ? "internal" : "external",
        status: doc.status || "completed",
        contentVersion: doc.contentVersion || null,
        startedAt: doc.startedAt || null,
        finishedAt: doc.finishedAt,
        results: (doc.results || []).map(function (r) {
          return { sortIndex: r.sortIndex, prompt: r.prompt, tests: r.tests, mode: r.mode,
            deckOrder: r.deckOrder || [], groups: r.groups || [], other: r.other || [],
            unsorted: r.unsorted || [], timeMs: r.timeMs, moves: r.moves, trail: r.trail || [],
            confidence: r.confidence, notes: r.notes };
        })
      };
    }), null, 2);
  }

  function mdEscape(s) {
    // Keeps card labels, group names and notes from breaking a table row.
    return String(s == null ? "" : s).replace(/\|/g, "\\|").replace(/\r?\n/g, " ");
  }

  function markdownForDocs(docs) {
    var lines = ["# Grouping Study Results", "",
      "_Exported " + new Date().toLocaleString() + "_", "",
      "**Covers " + audienceSummary(docs) + ".**"];
    if (audienceCounts(docs).internal && audienceCounts(docs).external) {
      lines.push("", "> This export mixes doTERRA staff with customers. Staff already know the proposed structure, so the aggregate figures below read higher than a customer-only set would. Split them on the Participant type column of the CSV export before quoting anything.");
    }

    (activeStudy.sorts || DEFAULT_SORTS).forEach(function (s, idx) {
      var a = analysisForSort(idx, docs);
      if (!a.n) return;
      lines.push("", "## Sort " + (idx + 1) + " · aggregate", "");
      lines.push("Participants: " + a.n + " · Mode: " + s.mode + " · Median time: " + fmtTime(a.medianTime) +
        " · Median cards left in the deck: " + a.medianUnsorted);
      lines.push("");
      lines.push("_" + agreementRuleText() + " At this sample size, treat these as directional and read them alongside the session notes._");
      lines.push("", "### Card agreement", "");
      lines.push("| Card | N | Most common group | Agreement | Band | Other | Left in deck |");
      lines.push("|---|---|---|---|---|---|---|");
      a.cards.forEach(function (c) {
        lines.push("| " + mdEscape(c.card) + " | " + c.n + " | " + mdEscape(c.top || "None") + " | " +
          (c.topPct == null ? "·" : c.topPct + "%") + " | " + agreementLabel(c.topPct) + " | " +
          c.parked + " | " + c.unsorted + " |");
      });
      if (a.parked.length) {
        lines.push("", "### Cards parked in " + OTHER_LABEL, "");
        a.parked.forEach(function (c) {
          lines.push("- **" + c.card + "**, parked by " + plural(c.parked, "participant"));
          c.reasons.forEach(function (x) { lines.push("  - " + x.participant + ": " + x.reason); });
        });
      }
      if (a.addedGroups.length) {
        lines.push("", "### Groups participants added", "");
        lines.push("| Group | Times created | Median size |");
        lines.push("|---|---|---|");
        a.addedGroups.forEach(function (g) {
          lines.push("| " + mdEscape(g.name) + " | " + g.uses + " | " + g.medianSize + " |");
        });
      }
      if (a.pairs.length) {
        lines.push("", "### Strongest card pairs", "");
        lines.push("| Card A | Card B | Grouped together |");
        lines.push("|---|---|---|");
        a.pairs.slice(0, 20).forEach(function (p) {
          lines.push("| " + mdEscape(p.a) + " | " + mdEscape(p.b) + " | " + p.pct + "% (" + p.together + "/" + p.both + ") |");
        });
      }
    });

    docs.forEach(function (doc) {
      lines.push("", "## " + (doc.participant || "(unnamed)"), "");
      lines.push("Status: " + (doc.status || "completed") + " · " + participantTypeLabel(doc) +
        (doc.contentVersion ? " · Content version: v" + doc.contentVersion : "") +
        (doc.finishedAt ? " · Finished: " + new Date(doc.finishedAt).toLocaleString() : ""));
      (doc.results || []).forEach(function (r) {
        lines.push("", "### Sort " + (r.sortIndex + 1) + " · " + fmtTime(r.timeMs || 0) +
          " · " + plural(r.moves || 0, "move") +
          " · confidence " + (r.confidence == null ? "not recorded" : r.confidence));
        (r.groups || []).forEach(function (g) {
          lines.push("", "**" + (g.name || "(unnamed group)") + "**" + (g.fixed ? "" : " _(added by participant)_"));
          (g.cards || []).forEach(function (c) { lines.push("- " + c); });
        });
        if ((r.other || []).length) {
          lines.push("", "**" + OTHER_LABEL + "**");
          r.other.forEach(function (o) { lines.push("- " + o.card + (o.reason ? ": " + o.reason : "")); });
        }
        if ((r.unsorted || []).length) {
          lines.push("", "**Left in the deck**");
          r.unsorted.forEach(function (c) { lines.push("- " + c); });
        }
        if (r.notes) lines.push("", "Moderator notes: " + r.notes);
      });
    });
    return lines.join("\n");
  }

  function slugify(s) {
    return (s || "session").toString().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "session";
  }

  // Works even when the Artifact's own `downloads` capability isn't there
  // (the file opened directly, or served from a plain local server) -- a
  // plain Blob + temporary <a download> is supported by any browser, so
  // exporting never depends on which runtime this page happens to be in.
  function triggerBrowserDownload(filename, data, mime) {
    try {
      var blob = new Blob([data], { type: mime || "text/plain" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      return true;
    } catch (e) { return false; }
  }

  function saveFile(filename, data, mime) {
    if (downloads) downloads.save({ filename: filename, data: data });
    else triggerBrowserDownload(filename, data, mime);
  }
  function downloadCsv(docs, base) { saveFile(base + ".csv", csvForDocs(docs), "text/csv"); }
  function downloadMatrix(docs, base) { saveFile(base + "-co-occurrence.csv", coOccurrenceCsv(docs), "text/csv"); }
  function downloadJson(docs, base) { saveFile(base + ".json", jsonForDocs(docs), "application/json"); }
  function downloadMarkdown(docs, base) { saveFile(base + ".md", markdownForDocs(docs), "text/markdown"); }

  // ---------- Onboarding tour ----------
  // Two steps on the first sort's briefing screen, plus two covering the
  // board itself once sorting is under way -- each pointing at a real
  // element by id, and each tagged with the phase it belongs to so the
  // tour never tries to render a step's target on the wrong screen.
  var ONBOARD_STEPS = [
    { target: "onboard-target-prompt", phase: "brief", title: "Your task",
      text: "You'll get a short instruction like this one, and a deck of cards to put into groups. There are no right answers here, we're testing the website, not you." },
    { target: "onboard-target-start", phase: "brief", title: "Where to start",
      text: "Press Start when you're ready. Take as long as you like once you're in." },
    { target: "onboard-target-deck", phase: "sorting", title: "Your cards",
      text: "These are the cards to sort. Tap one to pick it up, then tap the group you want it in. You can drag them instead if you prefer." },
    { target: "onboard-target-groups", phase: "sorting", title: "Where they go",
      text: "Drop cards into whichever group fits. If none of them do, make your own group, or use the Other bay at the bottom and tell us why. You can move anything again at any point." }
  ];

  function removeOnboardTour() {
    var root = document.getElementById("onboard-tour-root");
    if (root) root.remove();
  }

  // Ends the tour and returns focus to the next thing the participant
  // would naturally interact with, since the tip's own buttons (where
  // focus was) are about to be removed. Also resumes the sort timer if
  // this was a board step, which pauses it while shown.
  function skipOnboardTour() {
    var wasSorting = phase === "sorting";
    onboardStep = null;
    removeOnboardTour();
    resumeTimerFromOnboard();
    var target = wasSorting
      ? document.querySelector("#onboard-target-deck .card-chip")
      : document.getElementById("onboard-target-start");
    if (target) target.focus();
  }

  function renderOnboardTour() {
    removeOnboardTour();
    if (!onboardStep) return;
    var stepDef = ONBOARD_STEPS[onboardStep - 1];
    if (!stepDef || phase !== stepDef.phase) return;
    var targetEl = document.getElementById(stepDef.target);
    if (!targetEl) return;
    var rect = targetEl.getBoundingClientRect();

    var root = document.createElement("div");
    root.id = "onboard-tour-root";

    var spot = document.createElement("div");
    spot.className = "onboard-spotlight";
    spot.style.top = (rect.top - 14) + "px";
    spot.style.left = (rect.left - 14) + "px";
    spot.style.width = (rect.width + 28) + "px";
    spot.style.height = (rect.height + 28) + "px";
    root.appendChild(spot);

    var tip = document.createElement("div");
    tip.className = "onboard-tip";
    tip.setAttribute("role", "dialog");
    tip.setAttribute("aria-labelledby", "onboard-tip-title");
    tip.setAttribute("aria-describedby", "onboard-tip-text");
    tip.tabIndex = -1;
    var tipWidth = Math.min(300, window.innerWidth - 24);
    var left = Math.min(Math.max(rect.left, 12), window.innerWidth - tipWidth - 12);
    tip.style.left = left + "px";
    tip.style.width = tipWidth + "px";
    var tipGap = 26; // clears the spotlight's own padding plus a visual gap
    var spaceBelow = window.innerHeight - rect.bottom;
    if (spaceBelow < 200 && rect.top > 200) {
      tip.style.bottom = (window.innerHeight - rect.top + tipGap) + "px";
    } else {
      tip.style.top = (Math.min(rect.bottom, window.innerHeight - 200) + tipGap) + "px";
    }

    // Numbered within this screen's own mini-tour rather than across all
    // four steps, since there's a real gap in time between the two.
    var phaseSteps = ONBOARD_STEPS.filter(function (s) { return s.phase === stepDef.phase; });
    var localIndex = phaseSteps.indexOf(stepDef) + 1;
    var isLastOfPhase = localIndex >= phaseSteps.length;

    var stepLabel = document.createElement("div");
    stepLabel.className = "onboard-step-label";
    stepLabel.textContent = "STEP " + localIndex + " OF " + phaseSteps.length;
    tip.appendChild(stepLabel);

    var titleEl = document.createElement("div");
    titleEl.className = "onboard-tip-title";
    titleEl.id = "onboard-tip-title";
    titleEl.textContent = stepDef.title;
    tip.appendChild(titleEl);

    var textEl = document.createElement("div");
    textEl.className = "onboard-tip-text";
    textEl.id = "onboard-tip-text";
    textEl.textContent = stepDef.text;
    tip.appendChild(textEl);

    var actions = document.createElement("div");
    actions.className = "onboard-tip-actions";

    var skipBtn = document.createElement("button");
    skipBtn.className = "onboard-skip";
    skipBtn.textContent = "Skip";
    skipBtn.addEventListener("click", skipOnboardTour);
    actions.appendChild(skipBtn);

    var navGroup = document.createElement("div");
    navGroup.style.display = "flex";
    navGroup.style.gap = "8px";

    // Back only makes sense within the same mini-tour -- stepping back
    // across the brief/board boundary would target an element that
    // doesn't exist on the current screen.
    if (onboardStep > 1 && ONBOARD_STEPS[onboardStep - 2].phase === stepDef.phase) {
      var backBtn = document.createElement("button");
      backBtn.className = "btn btn-ghost";
      backBtn.textContent = "Back";
      backBtn.addEventListener("click", function () { onboardStep--; renderOnboardTour(); });
      navGroup.appendChild(backBtn);
    }

    var nextBtn = document.createElement("button");
    nextBtn.className = "btn btn-primary";
    nextBtn.textContent = isLastOfPhase ? "Got it" : "Next →";
    nextBtn.addEventListener("click", function () {
      if (isLastOfPhase) { skipOnboardTour(); }
      else { onboardStep++; renderOnboardTour(); }
    });
    navGroup.appendChild(nextBtn);

    actions.appendChild(navGroup);
    tip.appendChild(actions);
    root.appendChild(tip);
    document.body.appendChild(root);
    // Move keyboard focus into the tip so it doesn't get stranded on the
    // element that opened this step, and so screen readers announce it.
    tip.focus();
  }

  // ---------- Board renderers ----------
  function locationLabel(locationId) {
    return locationId === "deck" ? "the deck" : groupLabel(locationId);
  }

  function cardChip(card, locationId) {
    var isSelected = selectedCard === card;
    var chip = el("button", {
      class: "card-chip" + (isSelected ? " selected" : "") + (justPlaced === card ? " just-placed" : ""),
      "data-card": card,
      "aria-pressed": String(isSelected),
      "aria-label": card + ", in " + locationLabel(locationId) + ". " +
        (isSelected ? "Picked up. Choose a group to put it in." : "Press to pick it up.")
    }, [el("span", { class: "grip", "aria-hidden": "true", html: GRIP_ICON }), card]);
    chip.addEventListener("pointerdown", function (e) { onCardPointerDown(e, card, locationId, chip); });
    chip.addEventListener("click", function (e) {
      // Without this the click bubbles to the column underneath, which
      // would read as "put the held card here" the instant you try to
      // pick a different one up.
      e.stopPropagation();
      if (suppressNextClick) return;
      toggleSelect(card);
    });
    return chip;
  }

  function placeButton(targetId, labelText) {
    var btn = el("button", { class: "place-btn" }, [labelText || ("Put “" + selectedCard + "” here")]);
    btn.setAttribute("aria-label", "Put " + selectedCard + " in " + locationLabel(targetId));
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      placeCard(selectedCard, targetId);
    });
    return btn;
  }

  function renderDeck() {
    var remaining = deckCards();
    var deck = el("div", {
      class: "board-deck" + (remaining.length ? "" : " empty"),
      "data-drop-id": "deck",
      id: "onboard-target-deck"
    });
    deck.addEventListener("click", function () { if (selectedCard) placeCard(selectedCard, "deck"); });
    deck.appendChild(el("div", { class: "deck-head" }, [
      el("span", { class: "deck-title" }, ["Cards to sort"]),
      el("span", { class: "deck-count" }, [placedCount() + " of " + deckOrder.length + " placed"])
    ]));
    if (!remaining.length) {
      deck.appendChild(el("div", { class: "deck-empty-note" }, [
        "Every card has been placed. Drag one back up here if you change your mind."
      ]));
    } else {
      var strip = el("div", { class: "deck-strip" });
      remaining.forEach(function (c) { strip.appendChild(cardChip(c, "deck")); });
      deck.appendChild(strip);
    }
    if (selectedCard && placements[selectedCard]) {
      deck.appendChild(placeButton("deck", "Put “" + selectedCard + "” back in the deck"));
    }
    return deck;
  }

  function renderGroupColumn(g) {
    var cards = cardsIn(g.id);
    var col = el("div", {
      class: "group-col" + (g.fixed ? "" : " custom"),
      "data-drop-id": g.id
    });
    col.addEventListener("click", function () { if (selectedCard) placeCard(selectedCard, g.id); });

    var head = el("div", { class: "group-head" });
    if (g.fixed) {
      head.appendChild(el("div", { class: "group-name" }, [g.name]));
    } else {
      var input = el("input", {
        type: "text", class: "group-name-input", "data-group-id": g.id,
        placeholder: "Name this group", "aria-label": "Name for your group of " + plural(cards.length, "card")
      });
      input.value = g.name || "";
      input.addEventListener("click", function (e) { e.stopPropagation(); });
      input.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
      // Deliberately no render() here: re-rendering on every keystroke
      // would tear the field out from under the cursor.
      input.addEventListener("input", function () { renameGroup(g.id, input.value); });
      head.appendChild(input);
    }
    head.appendChild(el("span", { class: "group-count" }, [String(cards.length)]));
    if (!g.fixed) {
      var del = el("button", {
        class: "col-del", "aria-label": "Remove this group and send its cards back to the deck",
        title: "Remove group", html: TRASH_ICON
      });
      del.addEventListener("click", function (e) { e.stopPropagation(); deleteGroup(g.id); });
      head.appendChild(del);
    }
    col.appendChild(head);

    if (cards.length) {
      var list = el("div", { class: "group-cards" });
      cards.forEach(function (c) { list.appendChild(cardChip(c, g.id)); });
      col.appendChild(list);
    } else if (!selectedCard) {
      col.appendChild(el("div", { class: "group-hint" }, ["Empty"]));
    }
    if (selectedCard && placements[selectedCard] !== g.id) col.appendChild(placeButton(g.id));
    return col;
  }

  function renderOtherColumn() {
    var cards = cardsIn(OTHER_ID);
    var col = el("div", { class: "group-col other", "data-drop-id": OTHER_ID, style: "margin-top:12px;" });
    col.addEventListener("click", function () { if (selectedCard) placeCard(selectedCard, OTHER_ID); });
    col.appendChild(el("div", { class: "group-head" }, [
      el("div", { class: "group-name" }, [OTHER_LABEL]),
      el("span", { class: "group-count" }, [String(cards.length)])
    ]));
    col.appendChild(el("div", { class: "group-hint" }, [
      cards.length
        ? "A line on why each one didn't fit is the most useful thing you can leave us."
        : "Put a card here if it doesn't belong in any group, then tell us why."
    ]));
    if (cards.length) {
      var list = el("div", { class: "group-cards" });
      cards.forEach(function (c) {
        var wrap = el("div", { class: "other-card" });
        wrap.appendChild(cardChip(c, OTHER_ID));
        var reason = el("input", {
          type: "text", class: "other-reason", "data-card": c,
          placeholder: "Why doesn't it fit?", "aria-label": "Why " + c + " doesn't fit anywhere"
        });
        reason.value = otherReasons[c] || "";
        reason.addEventListener("click", function (e) { e.stopPropagation(); });
        reason.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
        reason.addEventListener("input", function () { setOtherReason(c, reason.value); });
        wrap.appendChild(reason);
        list.appendChild(wrap);
      });
      col.appendChild(list);
    }
    if (selectedCard && placements[selectedCard] !== OTHER_ID) col.appendChild(placeButton(OTHER_ID));
    return col;
  }

  function renderSorting() {
    var s = currentSort();
    var frag = document.createDocumentFragment();
    var head = el("div", { class: "card", style: "margin-bottom:16px;" });
    head.appendChild(el("div", { class: "eyebrow muted" }, ["PARTICIPANT"]));
    head.appendChild(el("div", { class: "progress-row" }, [
      el("span", { class: "step" }, [
        (sortCount() > 1 ? "SORT " + (sortIndex + 1) + " OF " + sortCount() + " · " : "") +
        placedCount() + " OF " + deckOrder.length + " PLACED"
      ]),
      practiceRun ? el("span", { class: "timer", id: "timer-readout" }, ["00:00"]) : null
    ]));
    head.appendChild(el("div", { class: "scenario compact" }, [s.prompt]));
    head.appendChild(el("div", { class: "think-aloud-note" }, [
      el("span", { class: "think-aloud-icon", html: SPEECH_ICON }),
      "Remember to think out loud as you go"
    ]));
    frag.appendChild(head);

    frag.appendChild(renderDeck());

    var boardWrap = el("div", { id: "onboard-target-groups" });
    // An open sort starts with nothing on the board but the New group
    // button, which leaves a participant who has never done this with no
    // idea that making a group is the first move.
    if (!groups.length) {
      boardWrap.appendChild(el("p", { class: "hint", style: "margin:0 0 10px; font-size:13px;" }, [
        "Start by making a group, then put cards into it. Make as many as you need, and name them however you'd say it."
      ]));
    }
    var grid = el("div", { class: "group-grid" });
    groups.forEach(function (g) { grid.appendChild(renderGroupColumn(g)); });
    if (canAddGroups()) {
      var addBtn = el("button", { class: "new-group-btn" }, [
        el("span", { style: "display:inline-flex;", html: PLUS_ICON }), "New group"
      ]);
      addBtn.addEventListener("click", addCustomGroup);
      grid.appendChild(addBtn);
    }
    boardWrap.appendChild(grid);
    if (otherEnabled()) boardWrap.appendChild(renderOtherColumn());
    frag.appendChild(boardWrap);

    if (selectedCard) {
      frag.appendChild(el("div", { class: "select-bar", role: "status" }, [
        el("div", {}, [
          el("div", { class: "picked-label" }, ["Holding"]),
          el("div", { class: "picked" }, [selectedCard])
        ]),
        el("div", { style: "display:flex; gap:10px; align-items:center; flex-wrap:wrap;" }, [
          el("span", { class: "hint", style: "margin:0; font-size:13px;" }, ["Now choose where it goes."]),
          el("button", { class: "btn btn-ghost", onclick: clearSelection }, ["Put it down"])
        ])
      ]));
    }

    if (confirmFinishSort) {
      var left = deckCards().length;
      frag.appendChild(el("div", {
        class: "warn-note", role: "alertdialog", "aria-label": "Confirm finishing with cards left",
        style: "display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;"
      }, [
        el("span", {}, [

  // ---------- Moderator screens ----------
  // A session interrupted mid-run (browser closed, crash, moderator moved
  // on by accident) is written incrementally, so it's still sitting in the
  // ledger as "in-progress" -- surface it so the moderator can pick it
  // back up instead of losing it, or explicitly abandon it.
  function renderResumeBanner() {
    var pending = ledgerDocs.filter(function (d) { return d.status === "in-progress"; });
    if (!pending.length) return null;
    var frag = document.createDocumentFragment();
    pending.forEach(function (doc) {
      var isConfirming = confirmDiscardResumeId === doc._id;
      var card = el("div", { class: "card", style: "border-color:var(--warn); background:var(--warn-bg);" });
      card.appendChild(el("div", { class: "eyebrow", style: "color:var(--warn);" }, ["INTERRUPTED SESSION"]));
      card.appendChild(el("p", { style: "margin:0 0 12px;" }, [
        "“" + (doc.participant || "(unnamed)") + "” (" + participantTypeLabel(doc) + ") stopped after " +
        (doc.results || []).length + " of " + sortCount() + " sort(s), without finishing. Resume it, or discard it and start fresh."
      ]));
      card.appendChild(el("div", { class: "btn-row", style: "margin-top:0;" }, isConfirming ? [
        el("span", { class: "hint", style: "align-self:center; margin:0;" }, ["Discard this session for good?"]),
        el("button", { class: "btn btn-ghost", onclick: function () { confirmDiscardResumeId = null; render(); } }, ["Cancel"]),
        el("button", { class: "btn btn-primary", style: "background:var(--fail);", onclick: function () { discardInProgress(doc._id); } }, ["Yes, discard"])
      ] : [
        el("button", { class: "btn btn-primary", onclick: function () { resumeSession(doc); } }, ["Resume session →"]),
        el("button", { class: "btn btn-ghost", onclick: function () { confirmDiscardResumeId = doc._id; render(); } }, ["Discard"])
      ]));
      frag.appendChild(card);

    return frag;
  }

      "The commonly cited baseline for stable clusters is around 15 participants, so treat every number in the Ledger as directional and lean on the notes and the Other reasons. " +
      (s.mode === "hybrid" ? "This is a hybrid sort, so the categories on screen will anchor people and push agreement scores up. Read them against that, and pay close attention to any group they add themselves. " : "") +
