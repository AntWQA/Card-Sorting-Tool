<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grouping Study</title>
<style>
  :root {
    /* doTERRA Pure - Base 1.2.2 tokens */
    --paper: #F6F7F8;
    --paper-raised: #FFFFFF;
    --ink: #354657;
    --muted: rgba(53,70,87,0.64);
    --line: rgba(190,196,201,0.55);
    --line-strong: #BEC4C9;
    --accent: #9D57B2;
    --accent-ink: #FFFFFF;
    --accent-tint: #EADAEE;
    --accent-glow: rgba(157,87,178,0.32);
    --success: #12B76A;
    --success-bg: rgba(18,183,106,0.12);
    --fail: #F04438;
    --fail-bg: rgba(240,68,56,0.12);
    --warn: #F79009;
    --warn-bg: rgba(247,144,9,0.12);
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 16px;
    --shadow: 0 1px 2px rgba(53,70,87,0.08), 0 6px 16px rgba(53,70,87,0.10);
    --font-display: 'Rawline', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-body: 'Rawline', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    /* Without this, native controls like the checkbox below follow the
       OS/browser's own dark-mode preference instead of this app's theme --
       so on a dark system it renders with dark chrome even while the page
       itself is showing the light theme. */
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #1B2430;
      --paper-raised: #232E3D;
      --ink: #E7ECEF;
      --muted: rgba(231,236,239,0.64);
      --line: rgba(190,196,201,0.22);
      --line-strong: rgba(190,196,201,0.4);
      --accent: #BD8BCA;
      --accent-ink: #2B1730;
      --accent-tint: rgba(157,87,178,0.2);
      --accent-glow: rgba(189,139,202,0.4);
      --success: #12B76A;
      --success-bg: rgba(18,183,106,0.18);
      --fail: #F04438;
      --fail-bg: rgba(240,68,56,0.18);
      --warn: #F79009;
      --warn-bg: rgba(247,144,9,0.18);
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 20px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #1B2430;
    --paper-raised: #232E3D;
    --ink: #E7ECEF;
    --muted: rgba(231,236,239,0.64);
    --line: rgba(190,196,201,0.22);
    --line-strong: rgba(190,196,201,0.4);
    --accent: #BD8BCA;
    --accent-ink: #2B1730;
    --accent-tint: rgba(157,87,178,0.2);
    --accent-glow: rgba(189,139,202,0.4);
    --success: #12B76A;
    --success-bg: rgba(18,183,106,0.18);
    --fail: #F04438;
    --fail-bg: rgba(240,68,56,0.18);
    --warn: #F79009;
    --warn-bg: rgba(247,144,9,0.18);
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 20px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  img { max-width: 100%; }
  a { color: var(--accent); }

  /* ---------- Motion ---------- */
  /* Small, functional transitions everywhere by default (color/background/
     border changes are not considered motion that needs reducing). */
  button, .card-chip, .group-col, .icon-btn, nav.views button, .chip, input[type="text"], textarea {
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  }
  @media (prefers-reduced-motion: no-preference) {
    button, .icon-btn { transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease; }
    button:active { transform: scale(0.97); }
    main.phase-enter { animation: motionCardIn 0.28s ease both; }
    .select-bar { animation: motionRiseIn 0.22s ease both; }
    .card-chip.selected, .badge { animation: motionPop 0.16s ease; }
    .export-menu { animation: motionRiseIn 0.15s ease both; }
    .shortcuts-panel { animation: motionRiseIn 0.18s ease both; }
    /* A card landing in a column is the one moment the participant needs
       confirmed without reading anything -- everything else here is a
       colour change. */
    .card-chip.just-placed { animation: motionLand 0.3s ease; }
    @keyframes motionCardIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes motionRiseIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes motionPop {
      from { transform: scale(0.94); }
      to { transform: scale(1); }
    }
    @keyframes motionLand {
      0% { transform: scale(0.88); background: var(--accent-tint); }
      100% { transform: scale(1); }
    }
  }

  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding-inline: 20px;
  }
  .wrap.wide { max-width: 1180px; }
  .wrap.board { max-width: 1400px; }

  header.top {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .top-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-block: 14px;
    flex-wrap: wrap;
  }
  .brand { display: flex; flex-direction: column; gap: 5px; }
  .brand .logo { display: flex; align-items: center; color: var(--ink); }
  .brand .logo svg { display: block; height: 24px; width: auto; }
  .brand h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
  }
  nav.views {
    display: flex;
    gap: 6px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
  }
  nav.views button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-weight: 600;
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  nav.views button.active { background: var(--ink); color: var(--paper); }

  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--muted);
    border-radius: 999px;
    cursor: pointer;
    padding: 0;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--line-strong); }
  .icon-btn svg { display: block; }
  .chevron-down { transform: rotate(90deg); }

  .export-menu-wrap { position: relative; display: inline-flex; }
  .export-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 230px;
    background: var(--paper-raised);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 4px;
    z-index: 30;
    display: flex;
    flex-direction: column;
  }
  .export-menu button {
    border: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    text-align: left;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .export-menu button:hover { background: var(--paper); }

  main { padding-block: 28px 64px; }

  .card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 24px;
  }
  .card + .card { margin-top: 18px; }

  h2 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 22px;
    margin: 0 0 4px;
    text-wrap: balance;
  }
  h3 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 16px;
    margin: 0 0 4px;
  }
  p.hint { color: var(--muted); font-size: 14px; margin: 0 0 18px; max-width: 60ch; }

  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .eyebrow.muted { color: var(--muted); }
  .handoff-card { text-align: center; padding: 52px 24px; }
  .handoff-card .scenario { font-size: 22px; }
  .handoff-card .hint { margin: 0 auto 22px; }
  .handoff-card .btn-row { justify-content: center; }
  .btn-big { font-size: 16px; padding: 16px 30px; }

  .handoff-graphic {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    margin: 6px 0 24px;
  }
  .handoff-party {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: var(--accent);
    transition: color 0.2s ease;
  }
  .handoff-party.dim { color: var(--muted); opacity: 0.55; }
  .handoff-icon {
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    border: 2px solid currentColor;
  }
  .handoff-icon svg { display: block; }
  .handoff-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .handoff-arrow { color: var(--line-strong); flex: 0 0 auto; }
  .handoff-arrow.reverse svg { transform: scaleX(-1); }

  .session-chevron {
    display: inline-flex;
    flex: 0 0 auto;
    color: var(--muted);
    transition: transform 0.15s ease;
  }
  .session-chevron.expanded { transform: rotate(90deg); }

  label.field {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type="text"], textarea {
    width: 100%;
    font: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
  }
  textarea { resize: vertical; min-height: 64px; }
  textarea.code-editor {
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.5;
    min-height: 340px;
    white-space: pre;
  }
  textarea.code-editor.short { min-height: 150px; }
  input[type="text"]:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  /* Built from scratch rather than left native: relying on the browser's
     own checkbox chrome (even with accent-color / color-scheme set) still
     rendered dark on some platforms regardless of this app's own theme.
     A fully custom box keyed to our own tokens can't drift from it. */
  input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    margin: 0;
    flex-shrink: 0;
    border: 1.5px solid var(--line-strong);
    border-radius: 5px;
    background: var(--paper-raised);
    display: inline-block;
    vertical-align: middle;
    position: relative;
    cursor: pointer;
  }
  input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
  input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 1px;
    width: 5px;
    height: 9px;
    border: solid var(--accent-ink);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .notes-cell { min-width: 220px; }
  textarea.notes-edit { font-size: 13px; padding: 8px 10px; min-height: 44px; margin-bottom: 6px; }
  .notes-save { font-size: 12px; padding: 6px 12px; }
  .notes-save:disabled { opacity: 0.45; cursor: not-allowed; }

  .session-row-toggle {
    background: none;
    border: none;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
    padding: 4px 2px;
    margin: -4px -2px;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    border-radius: 6px;
    flex-wrap: wrap;
  }

  main[tabindex="-1"] { outline: none; }

  /* ---------- Keyboard shortcuts panel ---------- */
  .shortcuts-backdrop {
    position: fixed; inset: 0;
    background: rgba(30, 34, 38, 0.4);
    z-index: 700;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .shortcuts-panel {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 24px;
    max-width: 420px;
    width: 100%;
    max-height: min(560px, 80vh);
    overflow-y: auto;
  }
  .shortcuts-panel h2 { margin-top: 0; }
  .shortcuts-list { list-style: none; margin: 0; padding: 0; }
  .shortcuts-list li {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .shortcuts-list li:last-child { border-bottom: none; }
  .shortcuts-list .desc { font-size: 14px; }
  .shortcuts-list .scope { display: block; font-size: 12px; color: var(--muted); }
  .kbd-row { display: flex; gap: 4px; flex-shrink: 0; }
  kbd.kbd {
    font-family: var(--font-mono);
    font-size: 12px;
    background: var(--paper);
    border: 1px solid var(--line-strong);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 3px 7px;
    color: var(--ink);
  }

  .btn {
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    border: 1px solid transparent;
    border-radius: 9px;
    padding: 11px 18px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  /* The small "press Enter" hint on a screen's one highlighted CTA
     (.cta-primary) -- always on an accent-colored button, so a plain
     translucent-white pill reads fine in both themes without its own
     tokens. */
  .cta-key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    padding: 1px 6px;
    border-radius: 5px;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    line-height: 1.4;
    background: rgba(255,255,255,0.22);
    border: 1px solid rgba(255,255,255,0.4);
    color: inherit;
  }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }
  .btn-quiet { background: transparent; color: var(--muted); border-color: transparent; padding: 8px 10px; font-size: 13px; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .think-aloud-note {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-style: italic;
    color: var(--muted);
  }
  .think-aloud-icon { display: inline-flex; flex: 0 0 auto; }

  .progress-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .progress-row .step {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .timer {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 22px;
    font-weight: 600;
    background: var(--accent-tint);
    color: var(--ink);
    padding: 4px 12px;
    border-radius: 8px;
  }

  .scenario {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 26px;
    line-height: 1.25;
    text-wrap: balance;
    margin: 0 0 6px;
    display: inline-block;
    max-width: 100%;
  }
  .scenario.compact { font-size: 19px; margin-bottom: 10px; }
  .scenario-meta { font-size: 13px; color: var(--muted); margin-bottom: 18px; }

  /* ---------- Sorting board ---------- */
  /* The deck sticks under the header so the next card is always reachable
     without scrolling back up a tall board. It's capped and scrolls
     internally rather than growing, so a 30-card deck can't swallow the
     screen and hide the columns it's meant to be dragged into. */
  .board-deck {
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 66px);
    z-index: 15;
    background: var(--paper-raised);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  /* --accent-tint is translucent in the dark theme, and both of these
     surfaces are sticky, so a bare tint lets the board scroll visibly
     through them. Painting the tint as a background-image over an opaque
     background-color keeps the same colour in both themes without the
     bleed. */
  .board-deck.drop-target {
    border-color: var(--accent);
    background-color: var(--paper-raised);
    background-image: linear-gradient(var(--accent-tint), var(--accent-tint));
  }
  .board-deck.empty { border-style: dashed; box-shadow: none; }
  .deck-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .deck-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .deck-count {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 10px;
  }
  .deck-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-height: 156px;
    overflow-y: auto;
    padding: 2px;
  }
  .deck-empty-note { font-size: 13px; color: var(--muted); padding: 4px 2px; }

  .group-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
    align-items: start;
    gap: 12px;
  }
  .group-col {
    background: var(--paper-raised);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    padding: 12px;
    min-height: 118px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .group-col.drop-target {
    border-color: var(--accent);
    background: var(--accent-tint);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  /* The Other column is deliberately set apart from the categories: it's
     a parking bay, not a peer of the real buckets, and reads as a caution
     so a participant doesn't fill it by default. */
  .group-col.other { border-color: var(--warn); background: var(--warn-bg); }
  .group-col.other.drop-target { border-color: var(--warn); box-shadow: 0 0 0 3px rgba(247,144,9,0.35); }
  .group-col.custom { border-style: dashed; }
  .group-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .group-name {
    font-weight: 700;
    font-size: 14px;
    line-height: 1.3;
    text-wrap: balance;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .group-col.other .group-name { color: var(--warn); }
  .group-count {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--muted);
    flex: 0 0 auto;
  }
  .group-name-input { font-size: 14px !important; padding: 7px 9px !important; font-weight: 600; }
  .group-cards { display: flex; flex-direction: column; gap: 6px; }
  .group-hint { font-size: 11px; color: var(--muted); font-style: italic; }

  /* One chip class for every card, wherever it is -- the deck, a column,
     or the Other bay -- so a card never changes shape as it moves and the
     participant keeps track of the one they just put down. */
  .card-chip {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--paper);
    border: 1px solid var(--line-strong);
    border-radius: 9px;
    padding: 9px 11px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.3;
    text-align: left;
    color: var(--ink);
    cursor: grab;
    /* Touch drags are handled by our own pointer handlers, so the browser
       must not claim the gesture for scrolling first. The page still
       scrolls from any of the surrounding surface. */
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    overflow-wrap: anywhere;
  }
  .card-chip:hover { border-color: var(--accent); }
  .card-chip.selected {
    background: var(--accent-tint);
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-glow);
  }
  .card-chip.dragging { opacity: 0.35; cursor: grabbing; }
  .card-chip .grip { color: var(--line-strong); flex: 0 0 auto; display: inline-flex; }
  .card-chip.selected .grip { color: var(--accent); }
  .drag-ghost {
    position: fixed;
    z-index: 800;
    pointer-events: none;
    opacity: 0.95;
    box-shadow: var(--shadow);
    transform: rotate(-1.5deg);
    background: var(--paper-raised);
    border-color: var(--accent);
    color: var(--accent);
    cursor: grabbing;
  }

  .other-card { display: flex; flex-direction: column; gap: 5px; }
  .other-reason {
    font-size: 12.5px !important;
    padding: 7px 9px !important;
    background: var(--paper-raised) !important;
  }
  .other-reason-read { font-size: 12px; color: var(--muted); font-style: italic; padding-left: 2px; }

  /* Sits above the board's own content at the bottom of the viewport while
     a card is picked up, because the column it needs to go into may be
     off-screen -- the instruction has to travel with the card. */
  .select-bar {
    position: sticky;
    bottom: 12px;
    z-index: 16;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    background-color: var(--paper-raised);
    background-image: linear-gradient(var(--accent-tint), var(--accent-tint));
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 16px;
    box-shadow: var(--shadow);
  }
  .select-bar .picked { font-weight: 700; font-size: 14px; }
  .select-bar .picked-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .board-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 18px;
  }
  .new-group-btn {
    border: 1px dashed var(--line-strong);
    background: transparent;
    color: var(--muted);
    border-radius: 12px;
    padding: 14px;
    font: inherit;
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
    min-height: 118px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }
  .new-group-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Deliberately quiet. With a card in hand every column shows one of
     these, and a grid of eleven solid accent buttons drowns out the group
     names, which are the thing the participant actually has to read to
     decide. Outlined keeps the affordance unmistakable without competing. */
  .place-btn {
    border: 1px dashed var(--accent);
    background: transparent;
    color: var(--accent);
    border-radius: 8px;
    padding: 7px 10px;
    font: inherit;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .place-btn:hover { background: var(--accent); color: var(--accent-ink); border-style: solid; }
  .group-col.other .place-btn { border-color: var(--warn); color: var(--warn); }
  .group-col.other .place-btn:hover { background: var(--warn); color: #fff; }
  .col-del {
    background: none;
    border: 0;
    color: var(--muted);
    cursor: pointer;
    padding: 2px;
    display: inline-flex;
    flex: 0 0 auto;
    border-radius: 4px;
  }
  .col-del:hover { color: var(--fail); }

  .naming-row {
    display: grid;
    grid-template-columns: minmax(190px, 260px) 1fr;
    gap: 14px;
    align-items: start;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .naming-row:last-of-type { border-bottom: none; }
  .naming-cards { display: flex; flex-wrap: wrap; gap: 6px; }
  .mini-chip {
    font-size: 12px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 4px 8px;
    color: var(--muted);
  }

  /* Audience filter. Staff already know the proposed structure, so their
     results are not comparable to a customer's: blending the two inflates
     every headline figure on this tab. The control drives the aggregates,
     the session log and the export together, so what you read is always
     what you would send. */
  .audience-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .audience-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .seg {
    display: flex;
    gap: 4px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
  }
  .seg button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-weight: 600;
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .seg button.active { background: var(--ink); color: var(--paper); }
  .seg button:disabled { opacity: 0.4; cursor: not-allowed; }
  .seg-n {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    opacity: 0.75;
  }

  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line-strong);
    background: var(--paper);
    color: var(--ink);
    border-radius: 999px;
    padding: 7px 14px;
    font: inherit;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  .chip.selected { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.strong { background: var(--success-bg); color: var(--success); }
  .badge.mixed { background: var(--warn-bg); color: var(--warn); }
  .badge.contested { background: var(--fail-bg); color: var(--fail); }
  .badge.neutral { background: var(--paper); border: 1px solid var(--line-strong); color: var(--muted); }

  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 700; }
  tbody tr:last-child td { border-bottom: none; }
  .table-scroll { overflow-x: auto; }
  td.num, th.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-tile { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .stat-tile .n { font-family: var(--font-mono); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat-tile .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }

  .empty { color: var(--muted); font-size: 14px; padding: 30px 0; text-align: center; }
  .warn-note { font-size: 13px; color: var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 10px 12px; margin-top: 14px; }
  .info-note { font-size: 13px; color: var(--muted); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 14px; }

  .onboard-spotlight {
    position: fixed;
    border-radius: 14px;
    box-shadow: 0 0 0 9999px rgba(30, 34, 38, 0.4), 0 0 0 2px var(--accent-glow), 0 0 0 5px var(--accent-glow);
    pointer-events: none;
    z-index: 600;
    transition: top 0.2s ease, left 0.2s ease, width 0.2s ease, height 0.2s ease;
  }
  .onboard-tip {
    position: fixed;
    z-index: 601;
    background: var(--paper-raised);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 14px 16px;
    font-family: var(--font-body);
    color: var(--ink);
  }
  .onboard-step-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .onboard-tip-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .onboard-tip-text { font-size: 13px; color: var(--muted); line-height: 1.4; margin-bottom: 12px; }
  .onboard-tip-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .onboard-skip {
    background: none;
    border: 0;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    padding: 6px 4px;
    text-decoration: underline;
  }

  details.method summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); }
  details.method { margin-top: 18px; }
  details.method .body { font-size: 13px; color: var(--muted); margin-top: 10px; max-width: 68ch; }

  @media (max-width: 760px) {
    /* A sorting board needs width. Below tablet, the columns stack into a
       single readable list rather than squeezing into unusable slivers --
       the tap-to-place path still works fully, drag just gets longer. */
    .group-grid { grid-template-columns: 1fr; }
    .new-group-btn { min-height: 56px; }
    .group-col { min-height: 0; }
    .naming-row { grid-template-columns: 1fr; gap: 8px; }
    .deck-strip { max-height: 168px; }
  }
  @media (max-width: 480px) {
    .brand h1 { font-size: 22px; }
    .scenario { font-size: 21px; }
    .card { padding: 18px; }
    .board-deck { top: calc(env(safe-area-inset-top, 0px) + 60px); }
  }
</style>
