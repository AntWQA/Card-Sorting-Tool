  function findExportWrap(menuId) {
    var wraps = document.querySelectorAll(".export-menu-wrap");
    for (var i = 0; i < wraps.length; i++) if (wraps[i].dataset.menuId === String(menuId)) return wraps[i];
    return null;
  }
  function closeExportMenu() {
    var prev = openExportMenu;
    openExportMenu = null;
    scheduleFocus(function () { var w = findExportWrap(prev); return w ? w.firstElementChild : null; });
    render();
  }

  function renderExportMenu(menuId, docsProvider, filenameBase, showLabel, includeMatrix) {
    var isOpen = openExportMenu === menuId;
    var wrap = el("div", { class: "export-menu-wrap", "data-menu-id": String(menuId) });
    var toggle = el("button", {
      class: showLabel ? "btn btn-ghost" : "icon-btn",
      style: showLabel ? "display:inline-flex; align-items:center; gap:6px;" : "",
      "aria-label": "Export", title: "Export",
      "aria-haspopup": "true", "aria-expanded": String(isOpen)
    }, showLabel
      ? [el("span", { style: "display:inline-flex;", html: EXPORT_ICON }), "Export", el("span", { style: "display:inline-flex;", html: CHEVRON_ICON, class: "chevron-down" })]
      : [el("span", { style: "display:inline-flex;", html: EXPORT_ICON })]);
    toggle.addEventListener("click", function () {
      var opening = !isOpen;
      openExportMenu = isOpen ? null : menuId;
      scheduleFocus(function () {
        var w = findExportWrap(menuId);
        if (!w) return null;
        return opening ? w.querySelector(".export-menu button") : w.firstElementChild;
      });
      render();
    });
    wrap.appendChild(toggle);

    if (isOpen) {
      // Downloading never depends on the Artifact's own `downloads`
      // capability -- saveFile() falls back to a plain browser download
      // when it isn't there, so these work published or standalone.
      var menu = el("div", { class: "export-menu", role: "menu" });
      var items = [["Download CSV (one row per card)", downloadCsv]];
      if (includeMatrix) items.push(["Download co-occurrence matrix (CSV)", downloadMatrix]);
      items.push(["Download Markdown report", downloadMarkdown]);
      items.push(["Download JSON", downloadJson]);
      items.forEach(function (pair) {
        var btn = el("button", { role: "menuitem" }, [pair[0]]);
        btn.addEventListener("click", function () {
          pair[1](docsProvider(), filenameBase);
          openExportMenu = null;
          scheduleFocus(function () { var w = findExportWrap(menuId); return w ? w.firstElementChild : null; });
          render();
        });
        menu.appendChild(btn);
      });
      var copyBtn = el("button", { role: "menuitem" }, ["Copy as CSV"]);
      copyBtn.addEventListener("click", function () { copyToClipboard(csvForDocs(docsProvider()), copyBtn); });
      menu.appendChild(copyBtn);
      wrap.appendChild(menu);
    }
    return wrap;
  }

  function renderSortAnalysis(s, idx, docs) {
    var a = analysisForSort(idx, docs);
    var frag = document.createDocumentFragment();

    var summary = el("div", { class: "card" });
    summary.appendChild(el("h2", {}, [sortCount() > 1 ? "Sort " + (idx + 1) + " · results" : "Results"]));
    summary.appendChild(el("p", { class: "hint" }, [s.prompt]));
    if (!a.n) {
      summary.appendChild(el("div", { class: "empty" }, [
        audienceFilter === "all"
          ? "No sessions saved for this sort yet. Run one from the Session tab."
          : "No " + audienceName(audienceFilter).toLowerCase() + " sessions for this sort. Other participant types may have some, switch the filter above."
      ]));
      frag.appendChild(summary);
      return frag;
    }
    summary.appendChild(el("div", { class: "stat-row" }, [
      el("div", { class: "stat-tile" }, [el("div", { class: "n" }, [String(a.n)]), el("div", { class: "l" }, ["Participants"])]),
      el("div", { class: "stat-tile" }, [el("div", { class: "n" }, [fmtTime(a.medianTime)]), el("div", { class: "l" }, ["Median time"])]),
      el("div", { class: "stat-tile" }, [el("div", { class: "n" }, [String(a.medianCustom)]), el("div", { class: "l" }, ["Median groups added"])]),
      el("div", { class: "stat-tile" }, [el("div", { class: "n" }, [String(a.medianUnsorted)]), el("div", { class: "l" }, ["Median left in deck"])]),
      el("div", { class: "stat-tile" }, [el("div", { class: "n" }, [String(a.medianMoves)]), el("div", { class: "l" }, ["Median card moves"])])
    ]));
    // The single most important caveat on this screen, so it sits above
    // the tables rather than in a collapsed note under them.
    summary.appendChild(el("div", { class: "info-note", style: "margin-top:0;" }, [
      a.n < 15
        ? "Directional only: " + plural(a.n, "participant") + " is below the ~15 where card-sort clusters settle down. Treat these as patterns to investigate against the session notes, not as figures to quote."
        : agreementRuleText()
    ]));
    if (s.mode === "hybrid") {
      summary.appendChild(el("div", { class: "info-note" }, [
        "This is a hybrid sort. The categories on screen anchor participants, so agreement here reads higher than the same cards sorted openly would. The groups people added themselves, below, are where the gaps show."
      ]));
    }
    frag.appendChild(summary);

    // --- Per-card agreement, weakest first: the cards that need work are
    // the point of the table, so they don't get buried under the settled ones.
    var cardsCard = el("div", { class: "card" });
    cardsCard.appendChild(el("h3", {}, ["Card agreement"]));
    cardsCard.appendChild(el("p", { class: "hint" }, ["Least agreed first. " + agreementRuleText()]));
    var cs = el("div", { class: "table-scroll" });
    var ct = el("table");
    ct.appendChild(el("thead", {}, [el("tr", {}, [
      el("th", {}, ["Card"]), el("th", { class: "num" }, ["N"]), el("th", {}, ["Most common group"]),
      el("th", { class: "num" }, ["Agreement"]), el("th", {}, ["Band"]),
      el("th", { class: "num" }, ["Groups used"]), el("th", { class: "num" }, ["Other"]), el("th", { class: "num" }, ["In deck"])
    ])]));
    var ctb = el("tbody");
    a.cards.forEach(function (c) {
      ctb.appendChild(el("tr", {}, [
        el("td", {}, [c.card]),
        el("td", { class: "num" }, [String(c.n)]),
        el("td", {}, [c.top || "None"]),
        el("td", { class: "num" }, [c.topPct == null ? "·" : c.topPct + "%"]),
        el("td", {}, [el("span", { class: "badge " + agreementBand(c.topPct) }, [agreementLabel(c.topPct)])]),
        el("td", { class: "num" }, [String(c.distinctGroups)]),
        el("td", { class: "num" }, [c.parked ? c.parked + " (" + c.parkedPct + "%)" : "·"]),
        el("td", { class: "num" }, [c.unsorted ? c.unsorted + " (" + c.unsortedPct + "%)" : "·"])
      ]));
    });
    ct.appendChild(ctb);
    cs.appendChild(ct);
    cardsCard.appendChild(cs);
    frag.appendChild(cardsCard);

    // --- Other / doesn't fit, with reasons. At a small sample this is the
    // most directly actionable table on the page.
    if (a.parked.length) {
      var parkedCard = el("div", { class: "card" });
      parkedCard.appendChild(el("h3", {}, ["Cards nobody could place"]));
      parkedCard.appendChild(el("p", { class: "hint" }, [
        "Parked in " + OTHER_LABEL + ", with whatever the participant said about why. A card here with a consistent reason is a label or a category problem you can act on without waiting for a bigger sample."
      ]));
      var ps = el("div", { class: "table-scroll" });
      var pt = el("table");
      pt.appendChild(el("thead", {}, [el("tr", {}, [
        el("th", {}, ["Card"]), el("th", { class: "num" }, ["Parked by"]), el("th", {}, ["Reasons given"])
      ])]));
      var ptb = el("tbody");
      a.parked.forEach(function (c) {
        var reasons = el("td", {});
        if (!c.reasons.length) {
          reasons.appendChild(el("span", { class: "hint", style: "margin:0;" }, ["No reasons given"]));
        } else {
          c.reasons.forEach(function (x) {
            reasons.appendChild(el("div", { style: "margin-bottom:4px;" }, [
              el("span", { style: "font-weight:600;" }, [x.participant + ": "]),
              el("span", {}, ["“" + x.reason + "”"])
            ]));
          });
        }
        ptb.appendChild(el("tr", {}, [
          el("td", {}, [c.card]),
          el("td", { class: "num" }, [c.parked + " of " + c.n]),
          reasons
        ]));
      });
      pt.appendChild(ptb);
      ps.appendChild(pt);
      parkedCard.appendChild(ps);
      frag.appendChild(parkedCard);
    }

    // --- Groups participants invented: what the proposed structure is missing.
    if (a.addedGroups.length) {
      var addedCard = el("div", { class: "card" });
      addedCard.appendChild(el("h3", {}, ["Groups participants added"]));
      addedCard.appendChild(el("p", { class: "hint" }, [
        "Names are matched ignoring case and spacing, nothing cleverer, so near-misses like “Daily use” and “Everyday” stay on separate rows. Read them together."
      ]));
      var as = el("div", { class: "table-scroll" });
      var at = el("table");
      at.appendChild(el("thead", {}, [el("tr", {}, [
        el("th", {}, ["Group name"]), el("th", { class: "num" }, ["Times created"]), el("th", { class: "num" }, ["Median size"])
      ])]));
      var atb = el("tbody");
      a.addedGroups.forEach(function (g) {
        atb.appendChild(el("tr", {}, [
          el("td", {}, [g.name]),
          el("td", { class: "num" }, [String(g.uses)]),
          el("td", { class: "num" }, [String(g.medianSize)])
        ]));
      });
      at.appendChild(atb);
      as.appendChild(at);
      addedCard.appendChild(as);
      frag.appendChild(addedCard);
    }

    // --- Card pairs.
    if (a.pairs.length) {
      var pairCard = el("div", { class: "card" });
      pairCard.appendChild(el("h3", {}, ["Cards that travel together"]));
      pairCard.appendChild(el("p", { class: "hint" }, [
        "How often two cards ended up in the same group, out of the participants who placed both. Cards parked in Other or left in the deck are excluded, since refusing to file two things isn't evidence they belong together. Full matrix is in the export."
      ]));
      var shown = expandedPairs ? a.pairs : a.pairs.slice(0, 12);
      var prs = el("div", { class: "table-scroll" });
      var prt = el("table");
      prt.appendChild(el("thead", {}, [el("tr", {}, [
        el("th", {}, ["Card A"]), el("th", {}, ["Card B"]), el("th", { class: "num" }, ["Together"]), el("th", { class: "num" }, ["Of"])
      ])]));
      var prtb = el("tbody");
      shown.forEach(function (p) {
        prtb.appendChild(el("tr", {}, [
          el("td", {}, [p.a]), el("td", {}, [p.b]),
          el("td", { class: "num" }, [p.pct + "%"]),
          el("td", { class: "num" }, [String(p.both)])
        ]));
      });
      prt.appendChild(prtb);
      prs.appendChild(prt);
      pairCard.appendChild(prs);
      if (a.pairs.length > 12) {
        pairCard.appendChild(el("div", { class: "btn-row" }, [
          el("button", {
            class: "btn btn-ghost",
            onclick: function () { expandedPairs = !expandedPairs; render(); }
          }, [expandedPairs ? "Show top 12 only" : "Show all " + a.pairs.length + " pairs"])
        ]));
      }
      frag.appendChild(pairCard);
    }
    return frag;
  }

  function renderAudienceBar() {
    var counts = audienceCounts(ledgerDocs);
    var card = el("div", { class: "card" });
    var bar = el("div", { class: "audience-bar" });
    bar.appendChild(el("span", { class: "audience-label", id: "audience-label" }, ["Showing"]));
    var seg = el("div", { class: "seg", role: "group", "aria-labelledby": "audience-label" });
    [["all", counts.all], ["external", counts.external], ["internal", counts.internal]].forEach(function (pair) {
      var key = pair[0], n = pair[1];
      var btn = el("button", {
        class: audienceFilter === key ? "active" : "",
        "data-audience": key,
        "aria-pressed": String(audienceFilter === key)
      }, [audienceName(key), el("span", { class: "seg-n" }, [String(n)])]);
      // A filter that empties the page is worse than no filter: leave the
      // button visible so the count still reads, but not selectable.
      if (!n && audienceFilter !== key) btn.disabled = true;
      btn.addEventListener("click", function () {
        audienceFilter = key;
        scheduleFocus(function () { return document.querySelector('.seg button[data-audience="' + key + '"]'); });
        render();
      });
      seg.appendChild(btn);
    });
    bar.appendChild(seg);
    card.appendChild(bar);
    if (audienceFilter === "internal") {
      card.appendChild(el("div", { class: "info-note", style: "margin-top:12px;" }, [
        "Staff only. Useful as a sense check on the deck and the wording, not as evidence about customers."
      ]));
    }
    return card;
  }

  function renderLedger() {
    subscribeLedger();
    var frag = document.createDocumentFragment();
    var mode = storageMode();
    if (mode === "none") {
      frag.appendChild(el("div", { class: "card" }, [el("div", { class: "empty" }, ["No results storage is available in this view, so there’s nothing to show yet."])]));
      return frag;
    }

    var shown = audienceDocs();
    if (ledgerDocs.length) frag.appendChild(renderAudienceBar());

    (activeStudy.sorts || DEFAULT_SORTS).forEach(function (s, idx) {
      frag.appendChild(renderSortAnalysis(s, idx, shown));
    });

    var raw = el("div", { class: "card" });
    raw.appendChild(el("div", { style: "display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;" }, [
      el("h2", { style: "margin:0;" }, ["Session log"]),
      el("div", { style: "display:flex; gap:8px;" }, [
        shown.length ? renderExportMenu("header", function () { return audienceDocs(); },
          "grouping-study-results" + (audienceFilter === "all" ? "" : "-" + audienceFilter), true, true) : null,
        ledgerDocs.length ? el("button", {
          id: "clear-all-btn",
          class: "btn btn-ghost", style: "color:var(--fail); border-color:var(--fail); display:inline-flex; align-items:center; gap:6px;",
          onclick: function () {
            confirmClearAll = true;
            scheduleFocus(function () { return document.getElementById("ledger-clearall-cancel"); });
            render();
          }
        }, [el("span", { style: "display:inline-flex;", html: TRASH_ICON }), "Clear all data"]) : null
      ])
    ]));
    raw.appendChild(el("div", { class: "hint", style: "margin:6px 0 0;" }, [
      "Export covers " + audienceSummary(shown) + ", matching the filter above. Every row carries its own participant type, so the two can always be split again downstream."
    ]));
    if (mode === "local") {
      raw.appendChild(el("div", { style: "margin-top:6px; color:var(--muted); font-size:14px; max-width:60ch;" }, [
        "Saved to this browser’s local storage only, not synced to other devices. Use Export regularly to keep a copy elsewhere."
      ]));
    }

    if (confirmClearAll) {
      raw.appendChild(el("div", {
        class: "warn-note", role: "alertdialog", "aria-label": "Confirm delete all sessions",
        style: "display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-top:12px; color:var(--fail); background:var(--fail-bg);"
      }, [
        el("span", {}, ["Delete all " + plural(ledgerDocs.length, "saved session") +
          (audienceFilter === "all" ? "" : ", including the ones the current filter is hiding") +
          "? This can't be undone."]),
        el("div", { style: "display:flex; gap:8px;" }, [
          el("button", {
            id: "ledger-clearall-cancel", class: "btn btn-ghost",
            onclick: function () {
              confirmClearAll = false;
              scheduleFocus(function () { return document.getElementById("clear-all-btn"); });
              render();
            }
          }, ["Cancel"]),
          el("button", { class: "btn btn-primary", style: "background:var(--fail);", onclick: clearAllSessions }, ["Yes, delete all"])
        ])
      ]));
    }

    if (!shown.length) {
      raw.appendChild(el("div", { class: "empty" }, [
        ledgerDocs.length
          ? "No " + audienceName(audienceFilter).toLowerCase() + " sessions saved. Switch the filter above to see the others."
          : "No sessions saved yet. Run one from the Session tab."
      ]));
    } else {
      shown.forEach(function (doc) {
        var block = el("div", { style: "margin-top:18px; padding-top:14px; border-top:1px solid var(--line);" });
        var isConfirming = confirmDeleteId === doc._id;
        var isExpanded = !!expandedSessions[doc._id];

        var nameRow = el("button", {
          class: "session-row-toggle", "data-doc-id": doc._id, "aria-expanded": String(isExpanded),
          onclick: function () {
            expandedSessions[doc._id] = !expandedSessions[doc._id];
            scheduleFocus(function () { return findSessionToggle(doc._id); });
            render();
          }
        }, [
          el("span", { class: "session-chevron" + (isExpanded ? " expanded" : ""), "aria-hidden": "true", html: CHEVRON_ICON }),
          el("span", { style: "font-weight:600;" }, [doc.participant || "(unnamed)"]),
          el("span", { class: "badge neutral" }, [doc.participantInternal ? "Internal" : "External"]),
          doc.status === "in-progress" ? el("span", { class: "badge mixed" }, ["In progress"]) : null,
          el("span", { class: "hint", style: "font-size:12px; margin:0;" }, [
            plural((doc.results || []).length, "sort") + (doc.finishedAt ? " · " + new Date(doc.finishedAt).toLocaleString() : "")
          ])
        ]);

        var actions = isConfirming
          ? el("div", { role: "alertdialog", "aria-label": "Confirm delete session", style: "display:flex; gap:8px; align-items:center;" }, [
              el("span", { class: "hint", style: "font-size:12px; margin:0;" }, ["Delete this session?"]),
              el("button", {
                id: "ledger-delete-cancel", class: "btn btn-ghost",
                onclick: function () {
                  confirmDeleteId = null;
                  scheduleFocus(function () { return findDeleteBtn(doc._id); });
                  render();
                }
              }, ["Cancel"]),
              el("button", { class: "btn btn-primary", style: "background:var(--fail);", onclick: function () { deleteSession(doc._id); } }, ["Confirm"])
            ])
          : el("div", { style: "display:flex; gap:6px; align-items:center;" }, [
              renderExportMenu(doc._id, function () { return [doc]; }, "grouping-study-" + slugify(doc.participant), false, false),
              el("button", {
                class: "icon-btn ledger-delete-btn", "data-doc-id": doc._id,
                "aria-label": "Delete session", title: "Delete session",
                onclick: function () {
                  confirmDeleteId = doc._id;
                  scheduleFocus(function () { return document.getElementById("ledger-delete-cancel"); });
                  render();
                },
                html: TRASH_ICON
              })

        block.appendChild(el("div", { style: "display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;" }, [nameRow, actions]));

        if (isExpanded) {
          (doc.results || []).forEach(function (r, resultIndex) {
            var detail = el("div", { style: "margin-top:14px;" });
            detail.appendChild(el("div", { class: "eyebrow muted", style: "margin-bottom:6px;" }, [
              (((doc.results || []).length > 1) ? "SORT " + (r.sortIndex + 1) + " · " : "") +
              fmtTime(r.timeMs || 0) + " · " + plural(r.moves || 0, "move") +
              " · CONFIDENCE " + (r.confidence == null ? "·" : r.confidence)
            ]));
            detail.appendChild(renderSortSummary(r, true));
            var notesArea = el("textarea", { class: "notes-edit", rows: "2", placeholder: "Add a note…" });
            notesArea.value = r.notes || "";
            var saveBtn = el("button", { class: "btn btn-ghost notes-save" }, ["Save"]);
            saveBtn.disabled = true;
            notesArea.addEventListener("input", function () { saveBtn.disabled = notesArea.value === (r.notes || ""); });
            saveBtn.addEventListener("click", function () {
              saveBtn.disabled = true;
              updateSessionNotes(doc._id, resultIndex, notesArea.value, saveBtn);
            });
            detail.appendChild(el("label", { class: "field", style: "margin-top:12px;" }, ["Moderator notes"]));
            detail.appendChild(notesArea);
            detail.appendChild(saveBtn);

        }
        raw.appendChild(block);

    }
    frag.appendChild(raw);
    return frag;

  // ---------- Content view ----------
  function renderContent() {
    if (sortsDraft == null) sortsDraft = JSON.stringify(activeStudy.sorts, null, 2);
    if (strongDraft == null) strongDraft = String(activeStudy.agreementStrong);
    if (weakDraft == null) weakDraft = String(activeStudy.agreementWeak);
    if (deckWarnDraft == null) deckWarnDraft = String(activeStudy.deckWarnAt);
    if (shuffleDraft == null) shuffleDraft = activeStudy.shuffleCards !== false;

    var frag = document.createDocumentFragment();
    var mode = storageMode();

    var intro = el("div", { class: "card" });
    intro.appendChild(el("div", { style: "display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px;" }, [
      el("h2", { style: "margin:0;" }, ["Content"]),
      el("span", { class: "hint", style: "margin:0; font-size:12px;" }, [
        "Live: v" + activeContentVersion + (contentUpdatedAt ? " · saved " + new Date(contentUpdatedAt).toLocaleString() : "")
      ])
    ]));
    intro.appendChild(el("p", { class: "hint" }, [
      mode === "shared"
        ? "Edit the deck, the categories and the prompt participants see, as plain JSON. Saved changes sync to every device running this tool, as a new version, and past sessions keep the version they ran against."
        : mode === "local"
          ? "Edit the deck, the categories and the prompt participants see, as plain JSON. Saved changes are kept in this browser's local storage only, as a new version, and won't sync to any other device or the published Artifact."
          : "Edit the deck, the categories and the prompt participants see, as plain JSON. No storage is available in this view, so changes apply here only and won't be saved for next time."
    ]));
    var inFlight = ledgerDocs.filter(function (d) { return d.status === "in-progress"; }).length;
    if (mode !== "none" && inFlight > 0) {
      intro.appendChild(el("div", { class: "warn-note" }, [
        "Heads up: " + inFlight + " session" + (inFlight === 1 ? " is" : "s are") + " currently in progress on v" + activeContentVersion +
        ". Saving publishes v" + (activeContentVersion + 1) +
        (mode === "shared" ? " to every device immediately." : " immediately.") +
        " Those sessions keep the v" + activeContentVersion + " tag they started with, but the next deck handed over will use the updated content."
      ]));
    }
    if (contentError) intro.appendChild(el("div", { class: "warn-note", style: "color:var(--fail); background:var(--fail-bg);" }, [contentError]));
    if (contentWarning) intro.appendChild(el("div", { class: "warn-note" }, [contentWarning]));
    frag.appendChild(intro);

    // --- Derive categories from a tree test IA. The whole point of the
    // pairing is that this study measures agreement against the exact
    // structure the Wayfinding Trial is validating, so the categories are
    // computed from that tree rather than retyped and left to drift.
    var importCard = el("div", { class: "card" });
    importCard.appendChild(el("h3", {}, ["Derive categories from a tree test IA"]));
    importCard.appendChild(el("p", { class: "hint" }, [
      "Paste the navigation structure from the Wayfinding Trial's Content tab. This pulls out its filing level, the branches its destination pages actually sit under, as a category list you can paste into a closed or hybrid sort below. Keeping the two in step is what makes the results comparable."
    ]));
    var importArea = el("textarea", { class: "code-editor short", spellcheck: "false", placeholder: '{\n  "Shop": {\n    "Shop by Category": ["Essential Oils", "..."]\n  }\n}' });
    importArea.value = treeImportDraft;
    importArea.addEventListener("input", function () { treeImportDraft = importArea.value; });
    importCard.appendChild(importArea);
    if (treeImportError) importCard.appendChild(el("div", { class: "warn-note", style: "color:var(--fail); background:var(--fail-bg);" }, [treeImportError]));
    if (treeImportResult) {
      var out = el("textarea", { class: "code-editor short", spellcheck: "false", readonly: "readonly" });
      out.value = JSON.stringify(treeImportResult, null, 2);
      importCard.appendChild(el("label", { class: "field", style: "margin-top:14px;" }, [plural(treeImportResult.length, "category") + " derived"]));
      importCard.appendChild(out);
      var copyDerived = el("button", { class: "btn btn-ghost" }, ["Copy"]);
      copyDerived.addEventListener("click", function () { copyToClipboard(out.value, copyDerived, out); });
      var applyBtn = el("button", { class: "btn btn-primary" }, ["Apply to sort 1"]);
      applyBtn.addEventListener("click", function () {
        var parsed;
        try { parsed = JSON.parse(sortsDraft); } catch (e) {
          contentError = "Can't apply: the sorts JSON below isn't valid right now (" + e.message + ").";
          render();
          return;
        }
        if (!Array.isArray(parsed) || !parsed.length) {
          contentError = "Can't apply: the sorts JSON below must be a non-empty array.";
          render();
          return;
        }
        parsed[0].categories = treeImportResult.slice();
        if (parsed[0].mode === "open") parsed[0].mode = "hybrid";
        sortsDraft = JSON.stringify(parsed, null, 2);
        contentError = null;
        contentWarning = "Categories applied to sort 1 in the editor below. Nothing is live until you press Save changes.";
        render();
      });
      importCard.appendChild(el("div", { class: "btn-row" }, [applyBtn, copyDerived]));
    }
    var deriveBtn = el("button", { class: "btn btn-ghost" }, ["Derive categories"]);
    deriveBtn.addEventListener("click", runTreeImport);
    if (!treeImportResult) importCard.appendChild(el("div", { class: "btn-row" }, [deriveBtn]));
    else importCard.appendChild(el("div", { class: "btn-row", style: "margin-top:10px;" }, [deriveBtn]));
    frag.appendChild(importCard);

    // --- Scoring and presentation knobs.
    var scoringCard = el("div", { class: "card" });
    scoringCard.appendChild(el("h3", {}, ["Reading the results"]));
    scoringCard.appendChild(el("p", { class: "hint" }, ["Where the Ledger draws the line between a card the structure handles and one it doesn't."]));
    var grid = el("div", { style: "display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:16px;" });

    function numField(id, label, hintText, getter, setter) {
      var wrap = el("div", {});
      wrap.appendChild(el("label", { class: "field", for: id }, [label]));
      var inp = el("input", { type: "text", inputmode: "numeric", id: id });
      inp.value = getter();
      inp.addEventListener("input", function () { setter(inp.value); });
      wrap.appendChild(inp);
      wrap.appendChild(el("p", { class: "hint", style: "margin:6px 0 0; font-size:12px;" }, [hintText]));
      return wrap;
    }
    grid.appendChild(numField("strong-input", "Strong agreement, %", "At or above this, a card reads as settled.",
      function () { return strongDraft; }, function (v) { strongDraft = v; }));
    grid.appendChild(numField("weak-input", "Contested below, %", "Under this, a card reads as contested and needs attention.",
      function () { return weakDraft; }, function (v) { weakDraft = v; }));
    grid.appendChild(numField("deckwarn-input", "Deck size guide", "Warn on save when a sort has more cards than this.",
      function () { return deckWarnDraft; }, function (v) { deckWarnDraft = v; }));
    scoringCard.appendChild(grid);

    var shuffleBox = el("input", { type: "checkbox", id: "shuffle-check" });
    shuffleBox.checked = shuffleDraft !== false;
    shuffleBox.addEventListener("change", function () { shuffleDraft = shuffleBox.checked; });
    scoringCard.appendChild(el("div", { style: "margin-top:16px; display:flex; align-items:flex-start; gap:8px;" }, [
      shuffleBox,
      el("label", { for: "shuffle-check", style: "font-size:13px; color:var(--muted);" }, [
        "Shuffle the deck for each participant. Cards shown first get placed while people are freshest, so a fixed order bakes the same bias into every session. Turn this off only if you need every participant to see the identical order."
      ])
    ]));
    frag.appendChild(scoringCard);

    // --- The study itself.
    var sortsCard = el("div", { class: "card" });
    var sortsArea = el("textarea", { class: "code-editor", spellcheck: "false" });
    sortsArea.value = sortsDraft;
    sortsArea.addEventListener("input", function () { sortsDraft = sortsArea.value; });
    var sortsCopyBtn = el("button", { class: "btn btn-ghost" }, ["Copy"]);
    sortsCopyBtn.addEventListener("click", function () { copyToClipboard(sortsArea.value, sortsCopyBtn, sortsArea); });
    sortsCard.appendChild(el("div", { style: "display:flex; justify-content:space-between; align-items:center; gap:8px;" }, [
      el("label", { class: "field", style: "margin-bottom:0;" }, ["Sorts"]),
      sortsCopyBtn
    ]));
    sortsCard.appendChild(el("p", { class: "hint", style: "margin-top:2px; font-size:12px;" }, [
      'An array of { prompt, tests, mode, cards, categories, allowOther }. Mode is "open" (participants build every group), "closed" (your categories only) or "hybrid" (your categories, plus any they add). Categories are required for closed and hybrid. allowOther turns the ' + OTHER_LABEL + " bay on, which is where the reasons come from."
    ]));
    sortsCard.appendChild(sortsArea);
    sortsCard.appendChild(el("div", { class: "btn-row" }, [
      el("button", { class: "btn btn-primary", onclick: function () { saveContent(); } }, ["Save changes"]),
      el("button", {
        class: "btn btn-ghost",
        onclick: function () {
          sortsDraft = null; strongDraft = null; weakDraft = null; deckWarnDraft = null; shuffleDraft = null;
          contentError = null; contentWarning = null;
          render();
        }
      }, ["Discard edits"]),
      el("button", { class: "btn btn-ghost", style: "color:var(--fail); border-color:var(--fail);", onclick: resetContent }, ["Reset to default"])
    ]));
    frag.appendChild(sortsCard);
    return frag;
  }

  // ---------- Root render ----------
  // A re-render replaces every node, so a participant mid-word in a group
  // name or an Other reason would lose the caret. These two fields are the
  // only free-text a participant types on their own screen, so their focus
  // and cursor position are carried across the rebuild.
  function captureTextFocus() {
    var a = document.activeElement;
    if (!a || !a.classList) return null;
    var isGroup = a.classList.contains("group-name-input");
    var isReason = a.classList.contains("other-reason");
    if (!isGroup && !isReason) return null;
    return {
      kind: isGroup ? "group" : "reason",
      key: isGroup ? a.dataset.groupId : a.dataset.card,
      start: a.selectionStart, end: a.selectionEnd
    };
  }
  function restoreTextFocus(snap) {
    if (!snap) return false;
    var selector = snap.kind === "group" ? ".group-name-input" : ".other-reason";
    var nodes = document.querySelectorAll(selector);
    for (var i = 0; i < nodes.length; i++) {
      var key = snap.kind === "group" ? nodes[i].dataset.groupId : nodes[i].dataset.card;
      if (key !== snap.key) continue;
      nodes[i].focus();
      try { nodes[i].setSelectionRange(snap.start, snap.end); } catch (e) {}
      return true;
    }
    return false;
  }

  function render() {
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
      window.claude.hot.snapshot(snapshotState());
    }
    var textFocus = captureTextFocus();
    document.documentElement.setAttribute("data-theme", theme);
    var app = document.getElementById("app");
    app.innerHTML = "";

    var showNav = navVisible();
    app.appendChild(el("header", { class: "top" }, [
      el("div", { class: "wrap top-inner" }, [
        el("div", { class: "brand" }, [
          el("div", { class: "logo", html: LOGO_SVG }),
          el("h1", {}, ["Grouping Study"])
        ]),
        el("div", { style: "display:flex; gap:8px; align-items:center;" }, [
          showNav ? el("nav", { class: "views" }, [
            el("button", { class: view === "session" ? "active" : "", "data-view": "session", onclick: function () { switchView("session"); } }, ["Session"]),
            el("button", { class: view === "ledger" ? "active" : "", "data-view": "ledger", onclick: function () { switchView("ledger"); } }, ["Ledger"]),
            el("button", { class: view === "content" ? "active" : "", "data-view": "content", onclick: function () { switchView("content"); } }, ["Content"])
          ]) : null,
          el("button", {
            id: "theme-toggle-btn", class: "icon-btn", onclick: toggleTheme,
            "aria-label": theme === "dark" ? "Switch to light mode" : "Switch to dark mode",
            title: theme === "dark" ? "Switch to light mode" : "Switch to dark mode",
            html: theme === "dark" ? SUN_ICON : MOON_ICON
          }),
          showNav ? el("button", {
            id: "shortcuts-btn", class: "icon-btn", onclick: function () { toggleShortcuts(); },
            "aria-label": "Keyboard shortcuts", title: "Keyboard shortcuts (?)",
            html: KEYBOARD_ICON
          }) : null
        ])
      ])
    ]));

    var wide = view === "ledger" || view === "content";
    var main = el("main", { class: "wrap" + (phase === "sorting" && view === "session" ? " board" : wide ? " wide" : ""), tabindex: "-1" });
    if (view === "ledger") main.appendChild(renderLedger());
    else if (view === "content") main.appendChild(renderContent());
    else if (phase === "setup") main.appendChild(renderSetup());
    else if (phase === "preview") main.appendChild(renderPreview());
    else if (phase === "brief") main.appendChild(renderBrief());
    else if (phase === "sorting") main.appendChild(renderSorting());
    else if (phase === "naming") main.appendChild(renderNaming());
    else if (phase === "return") main.appendChild(renderReturn());
    else if (phase === "capture") main.appendChild(renderCapture());
    else if (phase === "done") main.appendChild(renderDone());

    var phaseKey = view + ":" + phase;
    var isNewScreen = phaseKey !== lastPhaseKey;
    // The board re-renders on every card placement. Replaying the entrance
    // animation each time would make the whole page jump under the
    // participant's hand, so it only fires on a genuine screen change.
    if (isNewScreen) main.classList.add("phase-enter");
    lastPhaseKey = phaseKey;
    app.appendChild(main);

    if (phase === "sorting" && startedAt && !onboardPauseStart) startTimerTick(); else stopTimerTick();

    if (onboardStep && (phase === "brief" || phase === "sorting")) requestAnimationFrame(renderOnboardTour);
    else removeOnboardTour();

    // Keyboard-focus management: a full re-render replaces every element,
    // so the browser would otherwise drop focus to <body> on every
    // interaction. A field the participant was typing in wins; then an
    // action that knows where focus should land; otherwise a genuinely
    // new screen focuses the main region.
    if (restoreTextFocus(textFocus)) { pendingFocus = null; return; }
    if (pendingFocus) {
      var focusFn = pendingFocus;
      pendingFocus = null;
      var target = focusFn();
      if (target && typeof target.focus === "function") target.focus();
    } else if (isNewScreen) {
      main.focus();
    }
  }

  function navVisible() {
    return view === "ledger" || view === "content" || phase === "setup" || phase === "capture" || phase === "done";
  }

  function scheduleFocus(fn) { pendingFocus = fn; }

  function switchView(name) {
    view = name;
    if (name === "ledger") subscribeLedger();
    scheduleFocus(function () { return document.querySelector('nav.views button[data-view="' + name + '"]'); });
    render();
  }

  window.addEventListener("resize", function () {
    if (onboardStep && (phase === "brief" || phase === "sorting")) renderOnboardTour();
  });

  document.addEventListener("click", function (e) {
    if (openExportMenu !== null && !e.target.closest(".export-menu-wrap")) {
      openExportMenu = null;
      render();
    }
  });

  // ---------- Keyboard shortcuts ----------
  // Appended to <body> like the onboarding tour, so it overlays whatever
  // screen is showing rather than needing its own phase/view.
  var SHORTCUTS = [
    { keys: ["↵"], desc: "Activate the highlighted button", scope: "Wherever one’s shown" },
    { keys: ["Esc"], desc: "Put down a held card, close menus and dialogs", scope: null },
    { keys: ["?"], desc: "Show or hide this list", scope: "Moderator screens" },
    { keys: ["1"], desc: "Switch to Session", scope: "Moderator screens" },
    { keys: ["2"], desc: "Switch to Ledger", scope: "Moderator screens" },
    { keys: ["3"], desc: "Switch to Content", scope: "Moderator screens" },
    { keys: ["T"], desc: "Toggle light / dark theme", scope: "Moderator screens" },
    { keys: [isMac() ? "⌘" : "Ctrl", "S"], desc: "Save content changes", scope: "Content tab" }
  ];

  function isMac() { return /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || ""); }

  function removeShortcutsPanel() {
    var panel = document.getElementById("shortcuts-root");
    if (panel) panel.remove();
  }

  function toggleShortcuts(force) {
    shortcutsOpen = typeof force === "boolean" ? force : !shortcutsOpen;
    if (shortcutsOpen) {
      renderShortcutsPanel();
    } else {
      removeShortcutsPanel();
      var btn = document.getElementById("shortcuts-btn");
      if (btn) btn.focus();
    }
  }

  function renderShortcutsPanel() {
    removeShortcutsPanel();
    var backdrop = document.createElement("div");
    backdrop.id = "shortcuts-root";
    backdrop.className = "shortcuts-backdrop";
    backdrop.addEventListener("mousedown", function (e) { if (e.target === backdrop) toggleShortcuts(false); });

    var panel = document.createElement("div");
    panel.className = "shortcuts-panel";
    panel.setAttribute("role", "dialog");
    panel.setAttribute("aria-modal", "true");
    panel.setAttribute("aria-labelledby", "shortcuts-title");
    panel.tabIndex = -1;

    var head = document.createElement("div");
    head.style.cssText = "display:flex; justify-content:space-between; align-items:center; gap:12px;";
    var h = document.createElement("h2");
    h.id = "shortcuts-title";
    h.style.margin = "0";
    h.textContent = "Keyboard shortcuts";
    var closeBtn = document.createElement("button");
    closeBtn.className = "icon-btn";
    closeBtn.setAttribute("aria-label", "Close");
    closeBtn.innerHTML = CLOSE_ICON;
    closeBtn.addEventListener("click", function () { toggleShortcuts(false); });
    head.appendChild(h);
    head.appendChild(closeBtn);
    panel.appendChild(head);
    panel.appendChild(Object.assign(document.createElement("p"), {
      className: "hint", style: "margin-top:6px;",
      textContent: "Shortcuts are ignored while you're typing in a text field, except Esc and Save."
    }));

    var list = document.createElement("ul");
    list.className = "shortcuts-list";
    SHORTCUTS.forEach(function (s) {
      var li = document.createElement("li");
      var descWrap = document.createElement("span");
      var descEl = document.createElement("span");
      descEl.className = "desc";
      descEl.textContent = s.desc;
      descWrap.appendChild(descEl);
      if (s.scope) {
        var scopeEl = document.createElement("span");
        scopeEl.className = "scope";
        scopeEl.textContent = s.scope;
        descWrap.appendChild(scopeEl);
      }
      var kbdRow = document.createElement("span");
      kbdRow.className = "kbd-row";
      s.keys.forEach(function (k) {
        var kbd = document.createElement("kbd");
        kbd.className = "kbd";
        kbd.textContent = k;
        kbdRow.appendChild(kbd);
      });
      li.appendChild(descWrap);
      li.appendChild(kbdRow);
      list.appendChild(li);
    });
    panel.appendChild(list);

    backdrop.appendChild(panel);
    document.body.appendChild(backdrop);
    panel.focus();
  }

  document.addEventListener("keydown", function (e) {
    // The shortcuts panel is the only truly modal overlay here (a full
    // backdrop) and has just one focusable control, so keep Tab from
    // leaking focus out to whatever is behind it.
    if (shortcutsOpen && e.key === "Tab") {
      e.preventDefault();
      var close = document.querySelector(".shortcuts-panel .icon-btn");
      if (close) close.focus();
      return;
    }

    var tag = (document.activeElement && document.activeElement.tagName) || "";
    var typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (document.activeElement && document.activeElement.isContentEditable);

    // Works even while typing in the Content tab's JSON editor -- that's
    // the whole point of a save shortcut.
    if ((e.metaKey || e.ctrlKey) && !e.altKey && e.key.toLowerCase() === "s" && view === "content") {
      e.preventDefault();
      saveContent();
      return;
    }

    if (e.key === "Escape") {
      if (shortcutsOpen) { toggleShortcuts(false); return; }
      if (openExportMenu !== null) { closeExportMenu(); return; }
      if (dragState) { onCardPointerCancel(); return; }
      if (onboardStep && (phase === "brief" || phase === "sorting")) { skipOnboardTour(); return; }
      // Putting a held card down is the participant's own undo, so it
      // comes before any of the moderator confirmations below.
      if (selectedCard) { clearSelection(); return; }
      if (confirmFinishSort) {
        confirmFinishSort = false;
        scheduleFocus(function () { return document.getElementById("finish-sort-btn"); });
        render();
        return;
      }
      if (confirmRetake) {
        confirmRetake = false;
        scheduleFocus(function () { return document.getElementById("retake-sort-btn"); });
        render();
        return;
      }
      if (confirmEndSession) {
        confirmEndSession = false;
        scheduleFocus(function () { return document.getElementById("end-session-btn"); });
        render();
        return;
      }
      if (confirmDeleteId !== null) {
        var wasId = confirmDeleteId;
        confirmDeleteId = null;
        scheduleFocus(function () { return findDeleteBtn(wasId); });
        render();
        return;
      }
      if (confirmClearAll) {
        confirmClearAll = false;
        scheduleFocus(function () { return document.getElementById("clear-all-btn"); });
        render();
        return;
      }
      return;
    }

    // Enter activates the screen's highlighted primary action (marked with
    // .cta-primary and shown with its own ↵ hint) even when nothing has
    // been Tabbed to yet. If a button already has focus, leave it to the
    // browser's native Enter-activation rather than firing both.
    if (e.key === "Enter" && !e.metaKey && !e.ctrlKey && !e.altKey) {
      var activeTag = document.activeElement ? document.activeElement.tagName : "";
      var blocksEnter = activeTag === "TEXTAREA" || activeTag === "SELECT" || activeTag === "BUTTON" ||
        (document.activeElement && document.activeElement.isContentEditable);
      if (!blocksEnter) {
        // The onboarding tour sits on top without being a real focus trap
        // (its tip is a focused div, not a button), so without this Enter
        // would fall through to the CTA underneath and start the sort
        // mid-tour. While the tour is up, Enter drives it.
        if (onboardStep && (phase === "brief" || phase === "sorting")) {
          var tourNext = document.querySelector("#onboard-tour-root .onboard-tip-actions .btn-primary");
          if (tourNext) { e.preventDefault(); tourNext.click(); }
        } else if (activeTag === "INPUT" && selectedCard) {
          // Typing a group name with a card in hand: Enter should commit
          // the name, not fire the "I'm done sorting" CTA underneath.
          e.preventDefault();
          document.activeElement.blur();
        } else {
          var cta = document.querySelector("main .cta-primary");
          if (cta && !cta.disabled) { e.preventDefault(); cta.click(); }
        }
      }
      return;
    }

    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (typing) return;

    // The shortcuts panel documents moderator-only shortcuts (view
    // switching, theme, save), so it -- and the "?" that opens it -- stay
    // out of the participant's hands along with the rest of the nav.
    if (navVisible()) {
      if (e.key === "?") { toggleShortcuts(); return; }
      if (e.key === "1") { switchView("session"); return; }
      if (e.key === "2") { switchView("ledger"); return; }
      if (e.key === "3") { switchView("content"); return; }
      if (e.key.toLowerCase() === "t") { toggleTheme(); return; }
    }
  });

  function boot(hotData) {
    restoreState(hotData);
    initCapabilities();
    render();
  }

  if (window.claude && window.claude.hot && window.claude.hot.ready) {
    window.claude.hot.ready(function () { boot(window.claude.hot.data || {}); });
  } else {
    boot({});
  }
})();
</script>
